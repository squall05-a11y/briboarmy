<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ARMY EVOLUTION — 1v1</title>
<style>
:root{
  --bg:#0D0F0C; --panel:#171A15; --line:#2B3026; --txt:#EFEEE6; --dim:#8E937F;
  --amber:#E8A33D; --steel:#7FA8D9; --olive:#9BC24B; --red:#E8523D; --gold:#F5C542;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#field{margin:0!important;border:none!important;border-radius:0!important}
#cv{touch-action:none}
#myStrip{position:absolute;top:30px;left:8px;z-index:5;display:flex;flex-direction:column;gap:3px;
  background:#0D0F0CB8;border-radius:10px;padding:5px 8px;pointer-events:none}
#myLine{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:800}
#myLine b{color:var(--gold)}
#myLine #armyTag{color:var(--dim);font-family:ui-monospace,monospace;font-weight:700}
.tinyBarWrap{width:120px;height:4px;background:#000A;border-radius:2px;overflow:hidden}
.tinyBarWrap>div{height:100%;width:0%}
#progFill{background:linear-gradient(90deg,#7FA8D9,#3D6EA8)}
.tinyBarWrap.gold #xpFill{background:linear-gradient(90deg,#F5C542,#E8A33D)}
.orb{width:60px;min-height:56px;border-radius:14px;border:1.5px solid var(--line);
  background:#0D0F0CD8;color:var(--txt);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;padding:5px 2px;font-family:inherit;position:relative}
.orb .g{font-size:20px;line-height:1}
.orb .l{font-size:8.5px;font-weight:800;line-height:1.15;text-align:center;color:var(--dim);
  max-width:56px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.orb .p{font-size:9px;font-weight:800;font-family:ui-monospace,monospace;color:var(--gold)}
.orb.live{border-color:var(--gold);animation:canBuy 1.1s infinite}
.orb.live .l{color:var(--txt)}
.orb.dim{opacity:.35;animation:none}
.orb:active{transform:scale(0.94)}
#triadDock{position:absolute;left:8px;bottom:8px;z-index:5;display:flex;flex-direction:column;gap:6px}
#rightCol{position:absolute;right:8px;bottom:8px;z-index:5;display:flex;flex-direction:column;
  gap:6px;align-items:flex-end;max-height:calc(100% - 150px);flex-wrap:wrap;align-content:flex-end;overflow:visible;padding-bottom:env(safe-area-inset-bottom)}
#hireDockF{display:flex;flex-direction:column;gap:6px;overflow-y:auto;
  -webkit-overflow-scrolling:touch;min-height:0}
#stanceWrap{flex:none}
#stanceBtn{width:60px;height:60px;border-radius:16px;border:2px solid var(--gold);
  background:linear-gradient(180deg,#E8A33D,#C07A1B);color:#241500;font-weight:900;
  font-size:13px;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 #7A4E10;
  animation:canBuy 1.2s infinite}
#stanceBtn:active{transform:translateY(2px);box-shadow:none}
#stanceBtn.holding{background:var(--panel);color:var(--txt);border-color:var(--line);
  animation:none;box-shadow:none}
#midBtns{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;z-index:5;
  display:flex;gap:6px;align-items:stretch}
#midBtns #ultBtn{flex:0 0 52px;width:52px;border-radius:14px;position:relative;overflow:hidden;
  border:1.5px solid var(--line);background:#0D0F0CD8;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
#midBtns #tactBtn{width:118px;padding:10px 6px;font-size:14px;letter-spacing:1px;
  border-radius:14px;box-shadow:0 3px 0 #7A4E10}
#midBtns #tactBtn.cooling{opacity:.35;filter:grayscale(0.8);box-shadow:none}
#pendDot{position:absolute;top:-4px;right:-4px;background:var(--gold);color:#241500;
  font-size:9px;font-weight:900;border-radius:8px;padding:1px 5px}
#bottomUI{flex:0 0 auto;padding:6px 10px 10px;display:flex;flex-direction:column;gap:6px}
#myRow{display:flex;align-items:center;gap:8px;font-size:12px}
#myRow #myEra{font-weight:900;font-size:13px}
#myRow #armyTag{margin-left:auto;font-family:ui-monospace,monospace;color:var(--dim);font-size:12px}
#hireDock{display:flex;flex-direction:row;gap:6px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;padding-bottom:2px}
#hireDock .dockItem{flex:0 0 auto;min-width:86px}
#triadZone{display:flex;flex-direction:row;gap:6px}
#triadZone .triSlot{flex:1;min-width:0}
#btnRow2{display:flex;gap:8px}
#btnRow2 #ultBtn{flex:0 0 64px}
#btnRow2 #tactBtn{flex:1}
#camBtn{position:absolute;top:34px;right:8px;z-index:5;width:34px;height:34px;
  border-radius:10px;border:1.5px solid var(--line);background:#0D0F0CD0;color:var(--txt);
  font-size:17px;cursor:pointer}
#camBtn.auto{border-color:var(--gold);color:var(--gold)}
#leftUI{flex:0 0 128px;display:flex;flex-direction:column;gap:6px;padding:8px 4px 8px 8px;min-height:0}
#rightUI{flex:0 0 116px;display:flex;flex-direction:column;gap:6px;padding:8px 8px 8px 4px;min-height:0}
.sideHead{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:13px}
.sideStat{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim)}
.sideStat b{color:var(--gold)}
#btnCol{display:flex;flex-direction:column;gap:6px;margin-top:auto}
#hireDock{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px}
.dockItem{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;
  padding:7px 8px;cursor:pointer}
.dockItem .hn{font-weight:900;font-size:12.5px}
.dockItem .hr{font-size:9px;color:var(--dim)}
.dockItem .hp{font-family:ui-monospace,monospace;font-weight:800;font-size:11px;color:var(--gold);margin-top:2px}
.dockItem.poor{opacity:.38}
.dockItem.can{animation:canBuy 1.1s infinite;border-color:var(--gold)}
@keyframes canBuy{50%{box-shadow:0 0 10px #F5C54277;background:#241F12}}
#triadZone{display:flex;flex-direction:column;gap:5px}
.triSlot{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;
  padding:7px 8px;cursor:pointer;opacity:.35}
.triSlot.live{opacity:1;animation:canBuy 1.2s infinite}
.triSlot.poorCiv{opacity:.45;animation:none}
.triSlot .mt{font-size:9px;letter-spacing:1.5px;font-weight:800;color:var(--dim)}
.triSlot.pop .mt{color:#9BC24B}.triSlot.wep .mt{color:#E8A33D}.triSlot.civ .mt{color:#7FA8D9}
.triSlot .mn{font-weight:900;font-size:12px;line-height:1.25;margin-top:1px}
.triSlot .md{font-size:9.5px;color:var(--dim);margin-top:1px;line-height:1.3}
#pendBadge{color:var(--gold);font-weight:900}
#foeStrip{position:absolute;top:6px;left:8px;right:8px;display:flex;align-items:center;gap:8px;z-index:4}
#foeStrip #foeName{font-weight:900;font-size:12px;color:var(--red);white-space:nowrap}
#foeStrip #foeHpWrap{flex:1;height:8px;background:#000A;border:1px solid var(--line);border-radius:4px;overflow:hidden}
#foeStrip #foeEra{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--dim);white-space:nowrap}
#foeProgWrap{position:absolute;top:24px;left:8px;right:8px;height:3px;background:#000A;border-radius:2px;overflow:hidden;z-index:4}
#rotateHint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:#0D0F0CF5;z-index:30;font-size:18px;font-weight:900}


/* ── 상단: 적군 상태 ── */
#topbar{display:flex;align-items:center;gap:8px;padding:8px 14px 3px}
#foeName{font-weight:900;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;color:var(--red)}
#foeEra{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);white-space:nowrap}
#muteBtn{background:none;border:none;font-size:16px;cursor:pointer;padding:2px}
#foeHpWrap{height:8px;margin:0 14px 2px;background:var(--panel);border-radius:4px;overflow:hidden}
#foeHp{height:100%;width:100%;background:linear-gradient(90deg,#E8523D,#A8241A)}
#foeProgWrap{height:4px;margin:0 14px 4px;background:var(--panel);border-radius:2px;overflow:hidden}
#foeProg{height:100%;width:0%;background:#D93A6E}

/* ── 전장 ── */
#field{position:relative;flex:1;min-height:0;margin:2px 10px;border:1px solid var(--line);
  border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#banner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);
  z-index:30;font-weight:900;font-size:36px;letter-spacing:2px;opacity:0;pointer-events:none;
  text-shadow:0 0 18px rgba(0,0,0,0.9),0 3px 0 #000;white-space:nowrap;font-family:inherit}
#banner.show{animation:bannerPop 1.5s ease-out forwards}
@keyframes bannerPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.6)}
  12%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  22%{transform:translate(-50%,-50%) scale(1)}
  78%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}
}
#toastZone{position:absolute;top:12px;left:0;right:0;display:flex;flex-direction:column;
  align-items:center;gap:5px;pointer-events:none;z-index:4}
.toast{background:#000C;border:1px solid var(--line);border-radius:10px;padding:5px 14px;
  font-size:13px;font-weight:700;animation:tIn 2.4s forwards;max-width:90%;text-align:center}
.toast.gold{border-color:var(--gold);color:var(--gold);font-size:15px;box-shadow:0 0 16px #F5C54244}
.toast.red{border-color:var(--red);color:var(--red)}
.toast.evo{border-color:#fff;color:#fff;background:#F5C54233;font-size:15px}
@keyframes tIn{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}
  82%{opacity:1}100%{opacity:0}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}

/* ── 하단: 아군 상태 + 조작 ── */
#bottom{padding:6px 14px 10px}
#myRow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
#myEra{font-weight:900;font-size:13px;white-space:nowrap}
#trophyRow{font-size:12px}
#goldBox{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);margin-left:auto}
#goldBox b{color:var(--gold);font-size:15px}
#killBox{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim)}
#killBox b{color:var(--txt)}
#progWrap{height:6px;background:var(--panel);border-radius:3px;overflow:hidden;margin-bottom:5px}
#progFill{height:100%;width:0%;background:linear-gradient(90deg,#7FA8D9,#3D6EA8);transition:width .3s}
#xpRow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#lvTag{font-family:ui-monospace,monospace;font-weight:800;font-size:12px;color:var(--gold);min-width:52px}
#xpBar{flex:1;height:8px;background:var(--panel);border-radius:4px;overflow:hidden}
#xpFill{height:100%;width:0%;background:linear-gradient(90deg,#F5C542,#E8A33D)}
#armyTag{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);min-width:60px;text-align:right}
#btnRow{display:flex;gap:8px}
#hireBtn{flex:0 0 104px;padding:15px 6px;border-radius:16px;background:var(--panel);
  border:1.5px solid var(--line);color:var(--txt);font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
#hireBtn:active{background:#20241C}
#ultBtn{flex:0 0 58px;position:relative;overflow:hidden;padding:0;border-radius:16px;
  background:var(--panel);border:1.5px solid var(--line);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:22px}
#ultFill{position:absolute;left:0;right:0;bottom:0;height:0%;background:#E8523D44;pointer-events:none}
#ultIcon{position:relative;z-index:1}
#ultBtn.ready{border-color:var(--red);animation:nukePulse 0.9s infinite}
#tactBtn{flex:1;padding:15px;border:none;border-radius:16px;position:relative;
  overflow:hidden;background:linear-gradient(180deg,#E8A33D,#C07A1B);color:#241500;
  font-size:18px;font-weight:900;letter-spacing:2px;font-family:inherit;box-shadow:0 4px 0 #7A4E10;cursor:pointer}
#tactBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #7A4E10}
#tactBtn.cooling{background:var(--panel);color:var(--dim);box-shadow:none}
#tactBtn.nuke{background:linear-gradient(180deg,#FF5A5A,#B01020);color:#fff;
  animation:nukePulse 1s infinite;box-shadow:0 4px 0 #6B0A16}
@keyframes nukePulse{50%{filter:brightness(1.35)}}
#cdFill{position:absolute;left:0;top:0;bottom:0;width:0%;background:#FFFFFF22;pointer-events:none}

/* ── 오버레이 ── */
.overlay{position:absolute;inset:0;background:#0D0F0CF2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:22px;z-index:10;text-align:center;
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay h1{font-size:30px;letter-spacing:4px;font-weight:900;line-height:1.3}
.overlay .sub{color:var(--dim);font-size:14px;line-height:1.7}
.bigbtn{padding:14px 40px;border:none;border-radius:14px;font-size:18px;font-weight:800;
  font-family:inherit;cursor:pointer;background:var(--gold);color:#241500;box-shadow:0 4px 0 #A87F14}
.bigbtn:active{transform:translateY(3px);box-shadow:none}
.hidden{display:none!important}
.ovTitle{font-size:15px;font-weight:900;letter-spacing:2px;color:var(--gold)}
#cardZone{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;
  max-height:58vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;
  padding:14px 16px;text-align:left;cursor:pointer}
.card:active{border-color:var(--gold);background:#241F12}
.card .ct{font-size:10px;letter-spacing:2px;font-weight:800;margin-bottom:2px}
.card .cn{font-weight:900;font-size:16px}
.card .cd{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.5}
.card.pop .ct{color:#9BC24B} .card.wep .ct{color:#E8A33D} .card.civ .ct{color:#7FA8D9}
#hireList{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:360px;
  max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px}
.hireItem{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;
  padding:10px 12px;text-align:left;cursor:pointer}
.hireItem:active{border-color:var(--gold)}
.hireItem .hn{font-weight:900;font-size:14px}
.hireItem .hr{font-size:10.5px;color:var(--dim);margin-top:1px}
.hireItem .hp{font-family:ui-monospace,monospace;font-weight:800;font-size:13px;color:var(--gold);margin-top:4px}
.hireItem.poor{opacity:.4}
#slotReels{display:flex;gap:10px}
.sreel{width:82px;height:82px;background:linear-gradient(180deg,#20241C,#14170F);
  border:2px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:42px}
.sreel.spin .ss{filter:blur(1.5px);opacity:.85}
.sreel.lock{border-color:#7FA8D9}
.sreel.hit{border-color:var(--gold);box-shadow:0 0 18px #F5C54277;animation:pop .3s}
@keyframes pop{50%{transform:scale(1.13)}}
#slotResult{min-height:22px;font-weight:800;font-size:15px;color:var(--gold)}
#slotBtn{padding:13px 52px;border:none;border-radius:14px;font-size:18px;font-weight:900;
  letter-spacing:3px;font-family:inherit;cursor:pointer;background:linear-gradient(180deg,#E8523D,#B02418);
  color:#fff;box-shadow:0 4px 0 #6B1208}
#slotBtn:active{transform:translateY(3px);box-shadow:none}
#statGrid{display:flex;gap:24px}
#statGrid .st{display:flex;flex-direction:column;align-items:center}
#statGrid .lbl{font-size:10px;letter-spacing:2px;color:var(--dim)}
#statGrid .val{font-family:ui-monospace,monospace;font-size:24px;font-weight:800;color:var(--gold)}
/* ── 실시간 컴팩트 패널 ── */
#panelBar{position:absolute;left:8px;right:8px;bottom:8px;z-index:8;
  background:#0D0F0CE8;border:1.5px solid var(--gold);border-radius:14px;
  padding:8px;display:flex;flex-direction:column;gap:6px}
#panelTitle{font-size:11px;letter-spacing:2px;font-weight:900;color:var(--gold);text-align:center}
.pRow{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.mini{flex:1 0 30%;min-width:96px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:10px;padding:8px 9px;text-align:left;cursor:pointer}
.mini:active{border-color:var(--gold);background:#241F12}
.mini .mt{font-size:9px;letter-spacing:1.5px;font-weight:800;color:var(--dim)}
.mini .mn{font-weight:900;font-size:13px;margin-top:1px;line-height:1.25}
.mini .md{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.35}
.mini.pop .mt{color:#9BC24B}.mini.wep .mt{color:#E8A33D}.mini.civ .mt{color:#7FA8D9}
.mini .mp{font-family:ui-monospace,monospace;font-weight:800;font-size:12px;color:var(--gold);margin-top:3px}
.mini.poor{opacity:.4}
#panelClose{align-self:center;background:none;border:1px solid var(--line);color:var(--dim);
  border-radius:8px;padding:4px 16px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}
.sreelM{width:52px;height:52px;background:linear-gradient(180deg,#20241C,#14170F);
  border:2px solid var(--line);border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:27px}
.sreelM.spin .ss{filter:blur(1px);opacity:.85}
.sreelM.lock{border-color:#7FA8D9}
.sreelM.hit{border-color:var(--gold);box-shadow:0 0 14px #F5C54277;animation:pop .3s}
#slotStopM{flex:0 0 auto;padding:8px 20px;border:none;border-radius:10px;font-size:14px;
  font-weight:900;letter-spacing:2px;font-family:inherit;cursor:pointer;
  background:linear-gradient(180deg,#E8523D,#B02418);color:#fff}
.diffBtn{padding:9px 18px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--panel);color:var(--dim);font-size:14px;font-weight:800;font-family:inherit;cursor:pointer}
.diffBtn.sel{border-color:var(--gold);color:var(--gold)}
#leftCmd{position:absolute;left:8px;bottom:300px;z-index:6;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
#leftCmd button{font-size:13px;padding:8px 14px;border-radius:999px;color:#EFEEE6;font-weight:900;box-shadow:0 2px 8px #000A;letter-spacing:0.5px}
#leftCmd button:active{transform:scale(0.94)}
#standBtn{background:#241F12;border:2px solid #F5C542}
.trBtn{width:240px;padding:13px;background:#211D14;border:2px solid #8A6F45;border-radius:14px;color:#EFEEE6;font-weight:900;font-size:15px}
.trBtn span{font-size:11px;opacity:0.75;font-weight:700}
.trBtn:active{transform:scale(0.96);border-color:#F5C542}
.orb.s2{padding:7px 9px;font-size:11px}
.orb.s2 .g{font-size:15px}
#standBtn.on{background:#3A3018;box-shadow:0 0 12px rgba(245,197,66,0.4)}
#retreatBtn{background:#1B1E24;border:2px solid #8FA3B8}
#countdown{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,7,6,0.97);pointer-events:none}
#cdNum{font-size:120px;font-weight:900;color:#F5C542;text-shadow:0 0 30px rgba(245,197,66,0.6);animation:cdPop 0.7s ease-out}
#cdSub{margin-top:14px;font-size:15px;font-weight:800;color:#EFEEE6;opacity:0.9;text-align:center;padding:0 30px}
@keyframes cdPop{0%{transform:scale(1.8);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:1}}
.tpBtn{padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:11px;font-weight:800}.tpBtn.sel{background:#2E4E6E;border-color:#5A8AC0}
</style>
</head>
<body>
<div id="app">
  <div id="field">
    <canvas id="cv"></canvas>
    <div id="foeStrip">

let AC=null,muted=false;
const lastPlay={};
function au(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();}catch(e){}}
function rl(k,ms){const t=performance.now();if(lastPlay[k]&&t-lastPlay[k]<ms)return false;lastPlay[k]=t;return true;}
function tone(f0,f1,dur,type="square",vol=0.07,delay=0){
  if(muted||!AC)return;
  const t0=AC.currentTime+delay;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(sfxOut());
  o.start(t0);o.stop(t0+dur+0.02);
}
function noiseS(dur,vol=0.12,delay=0){
  if(muted||!AC)return;
  const t0=AC.currentTime+delay;
  const len=Math.floor(AC.sampleRate*dur);
  const buf=AC.createBuffer(1,len,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource();s.buffer=buf;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=1600;
  s.connect(f);f.connect(g);g.connect(sfxOut());s.start(t0);
}
function sfxOut(){
  try{
    if(!AC._comp&&AC.createDynamicsCompressor){
      AC._comp=AC.createDynamicsCompressor();
      try{AC._comp.threshold.value=-18;AC._comp.ratio.value=6;AC._comp.release.value=0.12;}catch(e){}
      AC._comp.connect(AC.destination);
    }
  }catch(e){}
  return AC._comp||AC.destination;
}
function famOf(id,role){
  if(["robo","railg","mecha","heroX"].includes(id))return "l"; // 레이저
  if(["musk","line","rifle","mg","gatl","gall","iron","bship","torp","raft"].includes(id))return "g"; // 총·함포

  if(["club","sling","cata","balli","spear","brz","phal","legio","sword","pike","char","eleph","ram","horse"].includes(id))return "s"; // 돌·근접
  if(role==="arty")return "a";
  return "s";
}

function autoCam(dt){
  if(!cam.auto&&ptrs.size===0&&(Math.abs(cam.vx)>2||Math.abs(cam.vy)>2)){
    cam.x+=cam.vx*dt;cam.y+=cam.vy*dt;
    cam.vx*=Math.pow(0.06,dt);cam.vy*=Math.pow(0.06,dt);
  }
  if(!cam.auto)return;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  const inc=(x,y)=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);
    minY=Math.min(minY,y);maxY=Math.max(maxY,y);};
  for(const u of army)inc(u.x,u.y);
  inc(cmdPos(P).x,cmdPos(P).y); // 적 지휘부는 프레임 밖 — 원정을 가야 보인다
  const pad=70;minX-=pad;minY-=pad;maxX+=pad;maxY+=pad;
  const bw=Math.max(200,maxX-minX),bh=Math.max(200,maxY-minY);
  const tz=Math.min(1.15,Math.max(fitZ(),Math.min(W/bw,H/bh))); // BUILD-02: 축소 한계 = 전장 전체
  const tx=(minX+maxX)/2-W/(2*tz), ty=(minY+maxY)/2-H/(2*tz);
  const k=Math.min(1,dt*3);
  cam.z+=(tz-cam.z)*k;cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
}
function toWorld(sx,sy){return [sx/cam.z+cam.x, sy/cam.z+cam.y];}

cv.addEventListener("pointerdown",e=>{

  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinch0=Math.hypot(a.x-b.x,a.y-b.y);camZ0=cam.z;tapCand=null;
  }
});
cv.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const nx=e.clientX-r.left,ny=e.clientY-r.top;
  const pt=ptrs.get(e.pointerId);
  if(ptrs.size===1){
    const dx=nx-pt.x,dy=ny-pt.y;
    if(tapCand&&Math.hypot(nx-tapCand.x,ny-tapCand.y)>9){tapCand.moved=true;cam.auto=false;}
    if(tapCand&&tapCand.moved){cam.x-=dx/cam.z;cam.y-=dy/cam.z;
      cam.vx=-dx/cam.z*30;cam.vy=-dy/cam.z*30;}
  } else if(ptrs.size===2){
    pt.x=nx;pt.y=ny;
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch0>0){cam.auto=false;
      const mid=[(a.x+b.x)/2,(a.y+b.y)/2];
      const [wx,wy]=toWorld(mid[0],mid[1]);
      cam.z=Math.min(2.4,Math.max(fitZ(),camZ0*d/pinch0)); // 축소=전장 전체, 확대=개별 유닛
      cam.x=wx-mid[0]/cam.z;cam.y=wy-mid[1]/cam.z;
    }
    updateCamBtn();return;
  }
  pt.x=nx;pt.y=ny;

});

function runCountdown(){
  const cd=$("countdown"),num=$("cdNum"),sub=$("cdSub");
  if(!cd||!num)return;
  cd.style.display="flex";
  if(!NET.on){introHold=true;introAcc=0;} // 1인: 설명 끝날 때까지 전장 동결
  cd.style.transition="none";cd.style.background="rgba(8,7,6,0.97)"; // 암전
  let phase=(!meta.tips&&!NET.on)?0:OPEN_RULES.length; // 첫 판 = 룰 설명부터
  if(phase===0){meta.tips=true;cd.style.pointerEvents="auto";}
  let skipped=false;
  cd.onclick=()=>{if(phase<OPEN_RULES.length){skipped=true;phase=OPEN_RULES.length;stepRule();}};
  function stepRule(){
    if(phase<OPEN_RULES.length&&!skipped){
      const [ic,tx]=OPEN_RULES[phase];
      num.textContent=ic;
      if(sub)sub.textContent=tx+"   (탭하여 건너뛰기)";
      num.style.animation="none";void num.offsetWidth;num.style.animation="cdPop 0.7s ease-out";
      SFX.step();phase++;
      setTimeout(stepRule,2000);
      return;
    }
    cd.style.pointerEvents="none";cd.onclick=null;
    if(sub)sub.textContent="원시부터 현대까지 — 문명전쟁에서 승리하라!";
    startNums();
  }
  const seq=["3","2","1","GO!"];let i=0;
  function startNums(){step();}
  const step=()=>{
    num.textContent=seq[i];
    num.style.animation="none";void num.offsetWidth;num.style.animation="cdPop 0.7s ease-out";
    if(seq[i]==="GO!"){SFX.alarm();try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
      introHold=false; // GO! = 개전
      cd.style.transition="background 0.55s ease";cd.style.background="rgba(8,7,6,0)";} // 개막
    else SFX.step();
    i++;
    if(i<seq.length)setTimeout(step,700);
    else setTimeout(()=>{cd.style.display="none";},650);
  };
  stepRule();
}

function doRetreat(S){
  const cost=100+50*S.era;
  if(S.gold<cost){if(!NET.on||S===mySide())toast(`💰 후퇴 비용 부족 — ${cost} 필요`);return false;}
  S.gold-=cost;
  S.stance="hold";S._allout=false;S.retreatT=6;
  for(const u of army)if(u.side===S)u.mode="hold";
  const mineR=NET.on?(S===mySide()):S.isPlayer;
  if(mineR){toast(`🏳 전술 후퇴! 💰${cost}`,"gold");SFX.alarm();}
  else toast("🏳 적군 전술 후퇴","red");
  updateStanceBtn();

}
function updateStanceBtn(){
  const b=$("stanceBtn");
  const S=NET.on?mySide():P;
  if(S.stance==="hold"){b.textContent="⚔ 돌격";b.classList.remove("holding");return;}
  const gar=army.filter(u=>u.side===S&&u.mode!=="attack").length;
  if(gar>0){b.textContent="⚔ 증원 "+gar;b.classList.remove("holding");}
  else{b.textContent="🛑 대기";b.classList.add("holding");}
  const fb=$("fleetBtn");
  if(fb){const hasD=structures.some(t=>t.side===S&&t.kind==="dock");
    fb.style.display=hasD?"":"none";
    fb.textContent=S.fleetOut?"⚓ 귀항":"⚓ 출항";}
  const rb=$("retreatBtn");
  if(rb){const rc=100+50*S.era;rb.textContent=`🏳 후퇴 💰${rc}`;rb.style.opacity=S.gold>=rc?1:0.45;}
  const sb=$("standBtn");
  if(sb)sb.classList.toggle("on",S.stance==="hold"&&army.some(u=>u.side===S&&u.mode==="stand"));
  const wb2=$("wonderBtn");
  if(wb2){const wS=structures.find(t=>t.side===S&&t.kind==="wonder"&&(t.bt||0)===S.era);
    const eW=Math.min(S.era,7);
    wb2.textContent=wS?(wS.building?`🏗 ${WONDER_NAME[eW].split(" ")[0]} ${Math.round(Math.min(1,wS.prog/wS.need)*100)}%`
      :`${WONDER_NAME[eW].split(" ")[0]} 완공`)
      :`${WONDER_NAME[eW]} 💰${WONDER_COST[eW]}`;
    wb2.style.opacity=(wS||S.gold<WONDER_COST[S.era])?0.45:1;}
}

function layoutArmy(side){

    if(d3.scout){u.hx=u.x;u.hy=u.y;continue;} // 🐕 정찰병은 대기를 무시한다
    rows[d3.role==="medic"?"arty":d3.role].push(u);}

    if(!n)continue;
    const perRank=Math.max(4,Math.floor(VW*0.88/52));
    // 전선 정원 = perRank×2열을 "병사 수(도트)" 기준으로 센다 — 객체 기준이면 승급 압축 때문에 상한이 영원히 안 걸린다(실측 0)

    list.forEach((u,i)=>{

      } else { // 예비대 — 기념탑 바로 앞에 최대한 밀집 (BUILD-05 §5)
        const perR2=Math.max(6,Math.floor(VW*0.5/34));
        const ri=i-frontCap;
        const rank=Math.floor(ri/perR2), col=ri%perR2;
        const inRank=Math.min(n-frontCap-rank*perR2,perR2);
        u.hx=VW/2+(col-(inRank-1)/2)*34;

        u._reserve=true;

      u.hy=side.isPlayer?Math.min(u.hy,R.base-6):Math.max(u.hy,R.base+6);
    });
  }
}

          const rng=(d.rngPx||330)*(allout?1.6:1); // 총력전: 장거리 포격
          const pool=tgts.filter(t=>{const dx=t.x-u.x,dy=t.y-u.y;return dx*dx+dy*dy<=rng*rng;});
          if(!d.naval)for(const oN of army)if(oN.side!==u.side&&unitDef(oN.id).naval){
            const dxN=oN.x-u.x,dyN=oN.y-u.y;
            if(dxN*dxN+dyN*dyN<=rng*rng)pool.push(oN);} // 연안 기회 사격
          const cmdT=pool.find(t=>t.isCmd);
          let tgt=null;
          if(cmdT&&SR()<(allout?0.35:0.3))tgt=cmdT; // 공성 포격
          else{const units=pool.filter(t=>!t.isCmd);
            tgt=units.length?units[Math.floor(SR()*units.length)]:cmdT;}
          if(tgt){const aoe=d.aoe*(1+0.25*u.tier);
            shots.push({side:u.side,x:u.x,y:u.y,tx:tgt.x,ty:tgt.y,arc:true,t:0,dur:0.55,
              dmg:unitDmg(u),aoe,col:d.col,fam:"a"});
            SFX.shootFam("a",u.side.era,!u.side.isPlayer);
            u.cd=d.cd;}
        } else {
          const rng=d.rngPx||260;
          const inR=tgts.filter(t=>{const dx=t.x-u.x,dy=t.y-u.y;return dx*dx+dy*dy<=rng*rng;});
          if(!d.naval)for(const oN of army)if(oN.side!==u.side&&unitDef(oN.id).naval){
            const dxN=oN.x-u.x,dyN=oN.y-u.y;
            if(dxN*dxN+dyN*dyN<=rng*rng)inR.push(oN);} // 연안 기회 사격 — 추격은 안 함
          let tgt;
          if(d.sniper){let b=-1;for(const t of inR){if(!t.isCmd&&t.hp>b){b=t.hp;tgt=t;}}
            if(!tgt&&inR.length)tgt=inR[inR.length-1];}
          else [tgt]=nearestOf(inR,u.x,u.y);
          if(tgt){
            const n=1+u.tier;
            for(let k=0;k<n;k++)fireShot(u.side,u,tgt,d,(k-(n-1)/2)*14);
            SFX.shootFam(famOf(u.id,d.role),u.side.era,!u.side.isPlayer);
            u.cd=d.cd;
          }
        }
      }
    }
  }

  // ── 발사체
  for(let i=shots.length-1;i>=0;i--){
    const p=shots[i];
    if(p.arc){
      p.t+=dt;
      if(p.t<0)continue;
      if(p.fam==="ms"&&!p._domed){ // 🛡 아이언돔 요격 — 매 프레임 재검사. 반경 밖은 다음 프레임에 다시 본다
        const k4=Math.max(0,p.t/p.dur),mx=p.x+(p.tx-p.x)*k4,my=p.y+(p.ty-p.y)*k4;
        for(const dm of structures){
          if(dm.kind!=="dome"||dm.side===p.side)continue;
          const dxD=mx-dm.x,dyD=my-dm.y;
          if(dxD*dxD+dyD*dyD<340*340){ // 반경 진입 시에만 판정을 확정한다
            if(SR()<0.75){
              window._mxDome=(window._mxDome||0)+1;
              boom(mx,my-30,70,"#8AE0FF");SFX.boom();
              toast(dm.side===(NET.on?mySide():P)?"🛡 아이언돔 요격!":"⚠ 미사일 요격당함","gold");
              shots.splice(i,1);
            } else p._domed=1; // 반경 안에서 확률에 실패한 미사일만 통과 확정
            break;
          }
        }
        if(!shots.includes(p))continue;
      }
      if(p.t>=p.dur){
        boom(p.tx,p.ty,p.aoe,p.col);SFX.boom();
        for(const t of enemyTargets(p.side)){
          if(t.kind==="monu")continue; // 수도는 모든 투사체 면역 — 근접만 부순다
          if(p.cmdShell&&(t.isStruct||t.isCmd))continue; // 필살기·포격 = 병력 전용 (건물·지휘부 불가)
          const dx=t.x-p.tx,dy=t.y-p.ty;
          if(dx*dx+dy*dy<p.aoe*p.aoe){
            let dm2=p.dmg;
            if(t.kind==="monu"){ // 수도: 발사 거리 감쇄 (멀수록 최대 75% 감소)
              const trav=Math.hypot(p.tx-p.x,p.ty-p.y);
              dm2*=Math.max(0.25,Math.min(1,1-(trav-180)/420));
            }
            dealTo(t,dm2,p.side);
          }
        }
        shots.splice(i,1);
      }
      continue;
    }
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.y<-30||p.y>VH+30||p.x<-30||p.x>VW+30){shots.splice(i,1);continue;}
    for(const t of enemyTargets(p.side)){
      const dx=t.x-p.x,dy=t.y-p.y,r=(t.r||8+(t.tier||0)*3.5)+4;
      if(dx*dx+dy*dy<r*r){
        if(SR()>(p.acc||1)){
          texts.push({x:t.x,y:t.y-((t.r||8))-4,v:"빗나감",c:"#8E937F",t:0.45});
          shots.splice(i,1);break;
        }
        let dmg=p.dmg;
        if(!t.isCmd&&!t.isStruct){const td=unitDef(t.id);
          if((td.role==="melee"||td.role==="tank")&&t.adv)dmg*=0.6;}
        if(SR()<p.side.crit)dmg*=1.8;
        if(p.srcU)t._lhU=p.srcU;
        dealTo(t,dmg,p.side);
        if(p.fire&&!t.isCmd)t.burn=2.0;
        if(p.side.blast){for(const o of enemyTargets(p.side)){if(o===t||o.isCmd)continue;
          const bx=o.x-t.x,by=o.y-t.y;if(bx*bx+by*by<30*30)dealTo(o,dmg*0.35,p.side);}}
        if(!p.pierced&&(p.side.pierce||p.side.barrageT>0)){p.pierced=true;}
        else shots.splice(i,1);
        break;
      }
    }
  }
  // 화상
  for(const u of army){if(u.burn>0){u.burn-=dt;u.hp-=u.maxHp*0.04*dt+6*dt;
    if(u.hp<=0)killUnit(u,foe(u.side));}}

  // ── 보급 (플레이어 레인)
  supplyT-=dt;
  if(supplyT<=0){
    supplyT=9e9; // 보급 룰렛 제거
    if(NET.on){
      const r2=SR();
      const ch2=r2<0.4?"💰":r2<0.65?"❤️":r2<0.85?"⚡":"🎁";
      NET.itemSeq=(NET.itemSeq||0)+1;
      items.push({id:NET.itemSeq,x:VW*0.15+SR()*VW*0.7,y:VH*0.40+SR()*VH*0.20,ch:ch2,t:7});
      toast("📦 보급 투하 — 먼저 탭하는 쪽이 획득!");
    } else {
      const r=Math.random();
      const ch=r<0.4?"💰":r<0.65?"❤️":r<0.85?"⚡":"🎁";
      items.push({x:VW*0.1+Math.random()*VW*0.8,y:VH*0.55+Math.random()*VH*0.35,ch,t:4});
      toast("📦 보급 투하 — 탭해서 획득!");
    }
  }
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.t-=dt;
    if(it.t<=0){items.splice(i,1);
      texts.push({x:it.x,y:it.y-10,v:"소멸",c:"#8E937F",t:0.6});}
  }

  // 최후의 결전 (9분): 전군 강제 돌격
  // (시간 강제 종료 장치 제거 — 교착 안전망은 데이터 검증 후 결정)
  if(stallStage>=2&&!window._allout){window._allout=true;
    toast("⏳ 총력전 돌입!","red");SFX.alarm();}
  // HUD
  updateHUD();

  // 파티클
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;if(p.t<=0)parts.splice(i,1);}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.y-=26*dt;t.t-=dt;if(t.t<=0)texts.splice(i,1);}
  for(let i=booms.length-1;i>=0;i--){booms[i].t-=dt;if(booms[i].t<=0)booms.splice(i,1);}
  for(let i=slashes.length-1;i>=0;i--){slashes[i].t-=dt;if(slashes[i].t<=0)slashes.splice(i,1);}
  for(let i=beams.length-1;i>=0;i--){beams[i].t-=dt;if(beams[i].t<=0)beams.splice(i,1);}
  for(let i=nukes.length-1;i>=0;i--){
    const n=nukes[i];n.t-=dt;
    if(n.intercepted&&n.t<=1.2){
      boom(n.tx,n.ty,60,"#9BC24B");texts.push({x:n.tx,y:n.ty,v:"요격됨",c:"#9BC24B",t:1});
      nukes.splice(i,1);continue;
    }
    if(n.t<=0){detonateNuke(n);nukes.splice(i,1);}
  }
  for(let i=mushrooms.length-1;i>=0;i--){mushrooms[i].t+=dt;if(mushrooms[i].t>2.2)mushrooms.splice(i,1);}
  for(let i=jets.length-1;i>=0;i--){
    const j=jets[i];j.t+=dt;
    if(j.vert)j.y=j.y0+(j.y1-j.y0)*(j.t/j.dur);
    else j.x=-VW*0.12+(VW*1.24)*(j.t/j.dur);
    if(j.t>=j.dur)jets.splice(i,1);
  }
  for(let i=missiles.length-1;i>=0;i--){
    const ms=missiles[i];ms.life-=dt;
    if(!ms.tgt||ms.tgt.hp<=0||ms.life<=0){
      boom(ms.x,ms.y,70,"#C2E07A");
      for(const u of army){const dx=u.x-ms.x,dy=u.y-ms.y;
        if(u.side!==ms.side&&dx*dx+dy*dy<70*70)dealTo(u,450*ms.side.atkMul,ms.side);}
      missiles.splice(i,1);continue;
    }
    const dx=ms.tgt.x-ms.x,dy=ms.tgt.y-ms.y,L=Math.hypot(dx,dy)||1;
    ms.x+=dx/L*ms.spd*dt;ms.y+=dy/L*ms.spd*dt;
    if(Math.random()<0.5)parts.push({x:ms.x,y:ms.y,vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*20,t:0.4,c:"#AAB6A0"});
    if(L<16){
      boom(ms.tgt.x,ms.tgt.y,70,"#C2E07A");SFX.boom();
      for(const u of army){const dx2=u.x-ms.tgt.x,dy2=u.y-ms.tgt.y;
        if(u.side!==ms.side&&dx2*dx2+dy2*dy2<70*70)dealTo(u,450*ms.side.atkMul,ms.side);}
      missiles.splice(i,1);
    }
  }
  if(slowT>0){slowT-=dt;if(slowT<=0)timeScale=1;}
  shakeT=Math.max(0,shakeT-dt);

  // 승패
  if(window._fallT){return;} // 함락 연출 중
  if(E.cmdHp<=0){beginFall(E,true,"적 지휘관을 쓰러뜨렸다.");return;}
  if(P.cmdHp<=0){beginFall(P,false,"지휘관이 쓰러졌다.");return;}
}
let supplyT=5;
function dealTo(t,dmg,fromSide){
  if(!isFinite(dmg)||dmg<=0)return;
  if(t.isStruct){
    if(t.kind==="monu"){
      let dM=dmg;
      t._shHit=gameTime;t.side._structHit=gameTime; // 재생 판정 + 수비대 호출
      if((t.sh||0)>0){const ab=Math.min(t.sh,dM);t.sh-=ab;dM-=ab;} // 실드 먼저
      if(dM>0)t.inv=Math.max(0,t.inv-dM*0.5);
      t.hitT=0.15;
      if(!t._alertT||gameTime-t._alertT>6){
        t._alertT=gameTime;
        const mineA=NET.on?(t.side===mySide()):t.side.isPlayer;
        if(mineA){banner("🏛 수도 피격!!","#FF5A45");shakeT=Math.max(shakeT,0.35);SFX.alarm();
          try{navigator.vibrate&&navigator.vibrate([40,40,80]);}catch(e2){}}
        else toast("🎯 적 수도 타격 중","gold");
      }
      return;
    }
    t.side._structHit=gameTime; // 아군 시설 피격 — 수비대 호출
    t.hp-=dmg;t.hitT=0.15;
    if(t.hp<=0){
      const i=structures.indexOf(t);
      if(i>=0)structures.splice(i,1);
      const BR={wall:110,wonder:170,tw:75,bank:95,hosp:95,snip:70,ic:85,mtw:55,peace:60,dc:80};
      const NM={wall:"🧱 방벽",wonder:"🏛 대건축",tw:"🗼 방어탑",bank:"🏦 시장",hosp:"🏥 병원",snip:"🎯 저격탑",ic:"🛡 요격 시설",mtw:"🗼 호위탑",peace:"🕊 평화 건축물",dc:"🖥 데이터센터"};
      if(t.kind==="peace"){window._mxPeaceKill=(window._mxPeaceKill||0)+1;updatePeacePill();}
      boom(t.x,t.y,BR[t.kind]||70,"#FF9A55");SFX.boom();
      shakeT=Math.max(shakeT,t.kind==="wonder"?0.5:0.22);
      for(let j2=0;j2<(t.kind==="wonder"?16:10);j2++)
        parts.push({x:t.x,y:t.y,vx:(Math.random()-0.5)*150,vy:-50-Math.random()*100,t:0.8,c:Math.random()<0.5?"#C8B99A":"#FF7A45"});
      const mineT=NET.on?(t.side===mySide()):t.side.isPlayer;
      toast(mineT?`${NM[t.kind]||"건물"} 파괴됨!`:`💥 적 ${(NM[t.kind]||"건물").replace(/^[^ ]+ /,"")} 파괴!`,mineT?"red":"gold");
    }
    return;
  }
  if(t.isCmd){
    const n=army.filter(u=>u.side===t.side&&(t.side.isPlayer?u.y>VH*0.62:u.y<VH*0.38)).length; // 수비대만 방패가 된다
    const cap=stallStage>=2?Math.max(0,0.92-stall2T*0.02):0.92;
    dmg*=(1-Math.min(cap,n*0.12));
    if(stallStage<2)dmg*=0.3; // 요새 방벽
    const S2=t.side;
    const fire2=S2.cmdHp<=S2.cmdMaxHp*0.3;
    dmg=Math.min(dmg,S2._cmdCap||0);
    S2._cmdCap=(S2._cmdCap||0)-dmg; // 함락전: 요새는 한 방에 안 무너진다
    if(fire2&&!S2._fireAnn){S2._fireAnn=1;
      const mineF=NET.on?(S2===mySide()):S2.isPlayer;
      banner(mineF?"🔥 본진 화재!! 붕괴 임박":"🔥 적 본진 화재!!",mineF?"#FF5A45":"#F5C542");
      SFX.alarm();shakeT=Math.max(shakeT,0.4);}
    t.side.cmdHp-=dmg;
    if(t.side.isPlayer)SFX.hurt();
    texts.push({x:t.x,y:t.y-16,v:"-"+Math.round(dmg),c:"#E8523D",t:0.6});
  } else {
    if(t.grace>0){texts.push({x:t.x,y:t.y-12,v:"행군",c:"#8E937F",t:0.35});return;}
    if(t.side.rallyT>0)dmg*=0.75; // 📣 일제사격: 방어
    const tHd=unitDef(t.id);
    if(tHd&&tHd.hero)dmg*=0.7; // 영웅 장갑 30%
    dmg*=STAR_DEF[starOf(t)]; // ★ 별: 받는 피해 감쇄
    if(t.side.shieldT>0)dmg*=0.55; // 🛡 방패벽
    dmg*=1-Math.min(0.14,Math.max(0,foe(t.side).era-t.side.era)*0.07); // 결사 항전 (완화)
    t.hp-=dmg;t.hitT=0.07;
    texts.push({x:t.x,y:t.y-((t.r||8))-4,v:Math.round(dmg),c:"#EFEEE6",t:0.45});
    if(t.hp<=0)killUnit(t,fromSide);
  }
}
function killUnit(u,killerSide){
  const idx=army.indexOf(u);
  if(idx<0)return;
  const d=unitDef(u.id);
  army.splice(idx,1);
  burst(u.x,u.y,d.col,8);
  killerSide.kills++;
  { const kU=u._lhU; // ★ 별 — 그 묶음이 쓰러뜨린 적 도트 수
    if(kU&&kU.side===killerSide&&army.indexOf(kU)>=0){
      kU.starK=(kU.starK||0)+Math.pow(5,u.tier);
      const sN=starOf(kU);
      if(sN>(kU._sAnn||0)){kU._sAnn=sN;
        if(killerSide.isPlayer&&!unitDef(kU.id).naval)toast(`⭐ ${unitDef(kU.id).name} 부대 ${"★".repeat(sN)} — 공속·방어 상승!`,"gold");}}}
  killerSide.gold+=GK[u.side.era]*0.42*killerSide.goldMul*(1+u.tier); // 전투는 돈의 가속
  u.side.ult=Math.min(100,u.side.ult+4*(1+u.tier));
  if(killerSide&&killerSide.era<MAX_ERA-1)killerSide.eraKills+=Math.pow(5,u.tier); // 전공
  const dh=unitDef(u.id);
  if(dh&&dh.hero){
    u.side.heroCostMul=(u.side.heroCostMul||1)*1.5;
    const mineHD=NET.on?(u.side===mySide()):u.side.isPlayer;
    // 💥 최후의 일격 — 전투기 이상의 폭발
    boom(u.x,u.y,200,"#F5C542");SFX.boom();shakeT=0.7;flash(0.3);
    for(const o of enemyTargets(u.side)){
      if(o.isCmd)continue;
      const dxF=o.x-u.x,dyF=o.y-u.y;
      if(dxF*dxF+dyF*dyF<200*200)dealTo(o,550*u.side.atkMul,u.side);
    }
    banner(mineHD?"💥 최후의 일격!!":"💥 적 영웅 최후의 일격!!","#F5C542");
    banner(mineHD?"💀 영웅 전사!!":"⚔ 적 영웅 처치!!",mineHD?"#FF5A45":"#F5C542");
    if(mineHD)renderHireDock();
    if(killerSide&&army.some(x=>x.side===killerSide&&unitDef(x.id).hero)){
      const bV=UNITS.find(x=>x.id===ERA_BASE_UNIT[killerSide.era]);
      addUnit(killerSide,bV.id,bV.pack||1,true);
      addUnit(killerSide,bV.id,bV.pack||1,true);
      const mineV2=NET.on?(killerSide===mySide()):killerSide.isPlayer;
      banner(mineV2?"🏆 영웅 승리 — 증원 도착!!":"⚠ 적 영웅 승리…",mineV2?"#F5C542":"#FF5A45");
    }
  }
  if(killerSide.isPlayer)SFX.kill();
  if(u.tier>0){
    if(u.side.isPlayer){toast(`💥 ${d.name} ${TIER_NAME[u.tier]} 전멸!`,"red");shakeT=0.25;}
    else toast(`🎉 적 ${d.name} ${TIER_NAME[u.tier]} 전멸`,"gold");
  }
  if(!army.some(x=>x.side===u.side)){
    if(!u.side.reliefUsed){
      // 첫 붕괴: 긴급 징집으로 배수진 — 노출 없음
      u.side.reliefUsed=true;
      const basic=UNITS.find(x=>x.id===ERA_BASE_UNIT[u.side.era])||UNITS.find(x=>x.id==="club");
      for(let r=0;r<5;r++)addUnit(u.side,basic.id,basic.pack||1,true);
      banner(u.side.isPlayer?"🚨 긴급 징집!!":"🚨 적 긴급 징집!!",u.side.isPlayer?"#F5C542":"#FF5A45");
    } else toast(u.side.isPlayer?"⚠ 전열 재붕괴 — 본진이 위험하다!":"🎯 적 전열 재붕괴!",u.side.isPlayer?"red":"gold");
    if(u.side.isPlayer){toast("⚠ 전열 붕괴 — 14초간 본진 노출!","red");SFX.alarm();shakeT=0.3;}
    else{toast("🎯 적 전열 붕괴 — 돌격하라! (14초)","gold");SFX.jack();}
  }
  layoutArmy(u.side);
}
function fireShot(side,u,tgt,d,spread=0){
  const dx=tgt.x-u.x+spread,dy=tgt.y-u.y,L=Math.hypot(dx,dy)||1;
  shots.push({side,srcU:u,x:u.x,y:u.y,vx:dx/L*470,vy:dy/L*470,acc:d.acc||1,big:d.big2||false,
    dmg:(u.maxHp!==undefined?unitDmg(u):d.dmg*side.atkMul),col:d.col,fire:side.fire,fam:famOf(u.id,d.role)});
}

          f:s=>{if(s.gold<civCost)return false;s.gold-=civCost;advanceCiv(s);return true;}}
        :{cat:"civ",tag:"기념비 건설",name:`🏛 기념비 투자 +${MONU_STEP[side.era]}`,cost:MONU_STEP[side.era],

/* ═══════════ AI ═══════════ */
function aiEvaluate(s){ // 🧠 자기 평가: "내 방식이 먹히고 있나" — 실패 2연속이면 다르게
  if(window.AIEVAL===0)return;
  const f=foe(s);
  if(!s._ev)s._ev={t:gameTime,myK:s.kills,foeK:f.kills,frontY:0,foeInv:0,fail:0,tac:"front",gold:s.gold};
  const ev=s._ev,period=DIFF.evalT||25;
  if(gameTime-ev.t<period)return;
  const killsGain=s.kills-ev.myK, lossGain=f.kills-ev.foeK;
  const tradeOK=killsGain>=lossGain*0.8;
  let frontY=0,n=0;
  for(const u of army)if(u.side===s&&!unitDef(u.id).naval){frontY+=u.y;n++;}
  frontY=n?frontY/n:0;
  const progressed=s.stance==="attack"&&n>0&&((s.isPlayer?ev.frontY-frontY:frontY-ev.frontY)>VH*0.02);
  const fm=getMonu(f);
  const foeMonuRush=fm&&(fm.inv-(ev.foeInv||0))>120;
  const fortIdx=structures.filter(t=>t.side===f&&(t.kind==="tw"||t.kind==="wall")&&Math.abs(t.fy-0.5)<0.16).length;
  const hoard=s.gold>900&&s.gold>ev.gold+250;
  let fail=false;
  if(s.stance==="attack"&&!progressed&&!tradeOK)fail=true;
  if(s.stance!=="attack"&&foeMonuRush)fail=true;
  ev.fail=fail?ev.fail+1:0;
  const say2=(m)=>toast(m,"red");
  if(ev.fail>=2){
    ev.fail=0;window._tacSw=(window._tacSw||0)+1;
    if(fortIdx>=4&&ev.tac!=="siege"){ev.tac="siege";s._siegeBias=1;say2(`⚠ ${s.faction.ch} 적, 공성 편성으로 전환!`);}
    else if((ev.tac==="siege"||ev.tac==="navy2"||ev.tac==="regroup")&&s.era>=1){ev.tac="navy";say2(`⚠ ${s.faction.ch} 적 함대 편성 — 해상 우회!`);}
    else if(!tradeOK){ev.tac="regroup";
      if(s.gold>=100+50*s.era)doRetreat(s);else doReturn(s); // 돈 있으면 빠르게, 없으면 느리게 — 사장과 같은 규칙
      say2(`⚠ ${s.faction.ch} 적, 전열 재편`);}
    else {ev.tac="front";s._siegeBias=0;}
  } else if(!fail&&hoard&&ev.tac==="front"){s._buildBias=1;}
  if(ev.tac==="navy"){
    const hasD=structures.some(t=>t.side===s&&t.kind==="dock");
    if(!hasD&&s.gold>=480){if(buildDock(s)){s.gold-=400;say2(`⚠ ${s.faction.ch} 적 조선소 건조!`);}}
    const myNav=army.filter(u=>u.side===s&&unitDef(u.id).naval).length;
    if(hasD&&myNav>=2&&!s.fleetOut)toggleFleet(s);
    if(hasD&&myNav>=6){ev.tac="navy2";}
  }
  ev.t=gameTime;ev.myK=s.kills;ev.foeK=f.kills;ev.frontY=frontY;ev.foeInv=fm?fm.inv:0;ev.gold=s.gold;
}
function aiUtilityAct(s){ // 🧠 "지금 이기는 데 뭐가 필요한가" — 상황 점수 최고안 1개 실행
  const f=foe(s);

  const foeHero=army.some(u=>u.side===f&&unitDef(u.id).hero);
  let best=null,bs=0.55; // 실행 문턱

  if(hd&&!heroAlive){ // 영웅: 교환비 열세·적 영웅·장기전일수록 절실
    const trade=Math.min(0.30,Math.max(0,(f.kills-s.kills))/150);
    const sc=0.28+trade+(foeHero?0.28:0)+Math.min(0.18,gameTime/900*0.18);

  }
  if(heroAlive&&(s.heroUpN||0)<5){ // 강화: 영웅이 살아 일하고 국고가 두둑할 때
    const sc=0.34+(s.gold>heroUpCost(s)*2.2?0.26:0)+(foeHero?0.1:0);
    cand(sc,heroUpCost(s)+250,()=>buyHeroUp(s));
  }
  if(s.era<MAX_ERA-1&&!structures.some(t=>t.side===s&&t.kind==="wonder"&&(t.bt||0)===s.era)){
    const sc=0.30+(s._invaded?0:0.18)+(eraFrac(s)<0.6?0.14:0); // 대건축: 평화 + 문명이 목마를 때
    cand(sc,WONDER_COST[s.era]+300,()=>doWonder(s));
  }
  // [BAL-8] 조선소: 해상 병과 개방 — navy 전술 도달 없이도 짓는다. 되돌리기: 이 블록 삭제
  if(s.era>=1&&!structures.some(t=>t.side===s&&t.kind==="dock")){
    cand(0.62,700,()=>{if(buildDock(s)){s.gold-=400;toast(`⚠ ${s.faction.ch} 적 조선소 건조!`,"red");}});
  }
  // BUILD-01 §8: AI는 모든 건물을 지을 수 있어야 한다
  const nK=k=>structures.filter(t=>t.side===s&&t.kind===k).length;
  if(s.era>=5&&nK("aa")<2&&army.some(u2=>u2.side===f&&unitDef(u2.id).carrier))cand(0.72,900,()=>{if(buildAA(s))s.gold-=700;});
  if(s.era>=6&&!nK("msb"))cand(0.5,3300,()=>{if(buildMsb(s))s.gold-=2800;});
  if(s.era>=6&&!nK("dome")&&(nKf("msb")||f.nukeStage))cand(0.8,2700,()=>{if(buildDome(s))s.gold-=2200;});
  if(s.era>=6&&!nK("ic")&&f.nukeStage)cand(0.76,2300,()=>{if(buildIntercept(s))s.gold-=1800;});
  if(s.era>=7&&nK("dc")<5)cand(0.58,3600,()=>{if(buildDc(s))s.gold-=3000;});
  // 🕊 평화 노선 — 판단이지 특혜가 아니다: 대건축 3+ 또는 경제 우위면 통합 선언
  if(s.era===7&&!s._strategy){
    s._strategy=(structures.filter(t=>t.side===s&&t.kind==="wonder").length>=3||s.gold>foe(s).gold*1.5)?"peace":"war";
    if(s._strategy==="peace"&&!s.isPlayer){banner("⚠ 적이 평화 통합을 선언했다!","#FF5A45");SFX.alarm();}
  }
  if(s._strategy==="peace"&&nK("peace")<100)cand(0.9,1700,()=>{if(buildPeace(s))s.gold-=1200;});
  function nKf(k){return structures.filter(t=>t.side===f&&t.kind===k).length;}
  if(best)best();
}

    cards.civ.f(s);toast(`${s.faction.ch} 적이 대응 병기를 개발한다`,"red");return;
  }
  // 건설권 갈망: 짓고 싶은데 잠겨 있으면 문명픽으로 해금을 번다
  const wantBuild=armyCount(s)>=10&&s.gold>=300;
  const lockedTw=!isUnlocked(s,"tw"),lockedBk=!isUnlocked(s,"bank");
  if(wantBuild&&(lockedTw||lockedBk)&&s.gold>=(cards.civ.cost||0)+150&&Math.random()<0.65){
    if(cards.civ.ok!==false){cards.civ.f(s);return;}
  }
  // 일시불 진급 가능하면 최우선
  if(s.era<MAX_ERA-1&&!s.nukeStage&&eraFrac(s)>=1&&s.gold>=lumpCost(s)){
    cards.civ.f(s);
    toast(`${s.faction.ch} 적이 새 시대로 진급했다!`,"red");SFX.alarm();
    return;
  }
  let pick;
  if(r<w.pop)pick=cards.pop;
  else if(r<w.pop+w.wep)pick=cards.wep;
  else pick=cards.civ;
  if(pick!==cards.civ&&s.gold>=(cards.civ.cost||0)*1.2&&Math.random()<(gameTime>300?0.75:0.5)){
    pick=cards.civ; // 국고 여유 — 문명에 투자
  }
  if(pick===cards.civ&&s.gold<(cards.civ.cost||0)){
    pick=Math.random()<0.5?cards.pop:cards.wep; // 국고 부족 — 문명 보류
  }
  pick.f(s);
  toast(`${s.faction.ch} 적장의 선택 — ${pick.tag}`,"red");
}
function aiThink(s){
  if(NET.on)return; // 2인전: AI 없음
  const needTw=structures.filter(t=>t.side===s&&t.kind==="tw").length<1+s.era;
  const needBk=structures.filter(t=>t.side===s&&t.kind==="bank").length<1+s.era;
  const buildFund=(needTw?TW_COST[s.era]:0)+(needBk?BK_COST[s.era]*0.5:0);
  const lumpSave=(s.era<MAX_ERA-1&&!s.nukeStage&&eraFrac(s)>=0.75)?lumpCost(s)*0.85:0; // 진급 적립금
  const civReserve=(s.nukeStage?700:MONU_STEP[s.era]*2)*0.5+buildFund*0.7+lumpSave;
  // 고용: 성향 역할 우선, 배치 구매 (축차 투입 방지)
  const navyOK=structures.some(t=>t.side===s&&t.kind==="dock"); // [BAL-8] 이중 잠금 해제: 관문은 조선소 보유. 되돌리기: s._ev&&(s._ev.tac==="navy"||s._ev.tac==="navy2")
  const avail=UNITS.filter(u=>(u.naval?(navyOK&&u.era<=s.era&&structures.some(t=>t.side===s&&t.kind==="dock")):((u.era===s.era||u.scout)&&isUnlocked(s,u.id)))&&!u.hidden&&!u.hero);
  let bought=0;
  const batchCap=gameTime<90?1:DIFF.batch; // 개전 워밍업 — 인간적인 출발
  const foeHero=army.find(u=>u.side!==s&&unitDef(u.id).hero);
  {aiEvaluate(s);aiUtilityAct(s);} // 자기 평가 → 수단 탐색
  if(DIFF.retreat){ // 🔥 헬 고유: 위기 시 유료 후퇴 (나머지 수단은 효용 코어가 판단)
    if(s.stance==="attack"&&s._invaded&&armyCount(s)<14&&s.gold>=100+50*s.era)doRetreat(s);
  }
  if(s.stance==="hold"&&s.gold>700+((s.era<MAX_ERA-1&&eraFrac(s)>=0.75)?lumpCost(s):0)&&armyCount(s)>=20){ // 진급 저금은 성역
    s.stance="attack";s._allout=true;for(const u of army)if(u.side===s)u.mode="attack";
    toast(`⚔ ${s.faction.ch} 적 대군 진격!`,"red");SFX.alarm();
  }
  // 🧠 지능: 기회 포착 — 적 야전군 열세 시 임계 무시 타격
  const foeField=army.filter(u=>u.side!==s&&u.mode==="attack").length
    +army.filter(u=>u.side!==s&&(s.isPlayer?u.y<VH*0.5:u.y>VH*0.5)).length;
  const myField=armyCount(s);
  if(s.stance==="hold"&&myField>=40&&myField>=foeField*1.6&&Math.random()<0.35){
    s.stance="attack";s._allout=true;for(const u of army)if(u.side===s)u.mode="attack";
    toast(`⚡ ${s.faction.ch} 적이 빈틈을 노려 기습!`,"red");SFX.alarm();
  }
  // 🧠 지능: 수도 위기 회군
  const myMonu=getMonu(s);
  if(s.stance==="attack"&&s._invaded&&myMonu&&myMonu.inv>0
     &&army.filter(u=>u.side===s&&u.mode==="hold").length<5&&Math.random()<0.5){
    s.stance="hold";s._allout=false;for(const u of army)if(u.side===s)u.mode="hold";
    toast(`🛡 ${s.faction.ch} 적군이 수도 방어로 회군!`);
  }
  // 🧠 지능: 건설 욕구 — 기본 인프라 우선, 그다음 상황 건설
  {
    const twN=structures.filter(t=>t.side===s&&t.kind==="tw").length;
    const bkN=structures.filter(t=>t.side===s&&t.kind==="bank").length;
    const wlN=structures.filter(t=>t.side===s&&t.kind==="wall").length;
    if(s._prefBank===undefined){s._prefBank=Math.random()<0.45;s._cushMul=0.7+Math.random()*1.6;} // 경제 인격: 시장파/요새파 + 지갑 성향
    const cushion=(120+s.era*40)*s._cushMul; // 짠돌이~신중파: 판마다 다른 여유금
    const bReady=armyCount(s)>=10&&s.gold>=cushion+Math.min(TW_COST[s.era],BK_COST[s.era])&&Math.random()<0.6; // 사람의 미적거림
    const doTw=()=>{if(buildTower(s)){s.gold-=TW_COST[s.era];
      if(!s._built1){s._built1=1;banner("⚠ 적, 요새화 시작!!","#FF5A45");}else toast("⚠ 적 방어탑 건설","red");return true;}return false;};
    const doBk=()=>{if(buildBank(s)){s.gold-=BK_COST[s.era];toast("⚠ 적 시장 건설","red");return true;}return false;};
    if(bReady&&s._prefBank&&isUnlocked(s,"bank")&&bkN<1+s.era&&s.gold>=BK_COST[s.era]+80){doBk();}
    else if(bReady&&isUnlocked(s,"tw")&&twN<1+s.era&&s.gold>=TW_COST[s.era]+60){doTw();}
    else if(bReady&&isUnlocked(s,"bank")&&bkN<1+s.era&&s.gold>=BK_COST[s.era]+80){doBk();}
    else if(bReady&&Math.random()<(s._buildBias?0.85:0.4)){if(s._buildBias)s._buildBias=0;
      if(s._invaded&&isUnlocked(s,"tw")&&s.gold>=TW_COST[s.era]+80){
        if(buildTower(s))s.gold-=TW_COST[s.era];
      } else if(s.era>=1&&wlN<5&&isUnlocked(s,"wall")&&s.gold>=WALL_COST[s.era]+80&&Math.random()<0.5){
        if(buildWall(s))s.gold-=WALL_COST[s.era];
      } else if(isUnlocked(s,"bank")&&s.gold>=BK_COST[s.era]+120){
        if(buildBank(s))s.gold-=BK_COST[s.era];
      }
    }
  }
  // 적 기념비 완공 임박 → 총공세
  const foeMonu=getMonu(foe(s));
  if(foeMonu&&foe(s).era<MAX_ERA-1&&foeMonu.inv>=MONU_NEED[foe(s).era]*0.72&&s.stance==="hold"){
    s.stance="attack";s._allout=true;for(const u of army)if(u.side===s)u.mode="attack";
    toast(`⚠ ${s.faction.ch} 적이 기념비 저지 총공세!`,"red");SFX.alarm();
  }
  for(let pass=0;pass<4&&bought<batchCap;pass++){
    let roleOrder=gameTime>260?["arty",...s.faction.roles]:s.faction.roles;
    if(s._siegeBias)roleOrder=["arty","arty",...roleOrder];
    if(foeHero){ // 적 영웅 대응 교리: 창병·포병 우선
      const sp=avail.find(u=>u.vsBig);
      if(sp&&s.gold>=sp.cost){s.gold-=sp.cost;addUnit(s,sp.id,sp.pack||1,true);bought++;continue;}
      roleOrder=["arty",...roleOrder];
    }
  for(const role of roleOrder){
      const opts=avail.filter(u=>u.role===role);
      if(!opts.length)continue;
      const u=opts[Math.floor(Math.random()*opts.length)];
      if(s.gold>=u.cost+civReserve&&Math.random()<0.7){s.gold-=u.cost;addUnit(s,u.id,u.pack||1,true);bought++;break;}
    }
  }
  // 스탠스: 임계 병력 도달 시 총돌격, 궤멸 시 대기 복귀
  const myN=armyCount(s); // 병사 수 기준 (승급 군집 포함)
  const foeCrossed=army.some(u=>u.side===P&&u.y<VH*0.5);
  const thresh=({pop:90,wep:120,civ:150}[s.faction.style]+s.era*25)*(DIFF.aggro||1)*(DIFF.retreat&&gameTime<120?1.5:1)*(window._aggro||1); // 헬: 초반 웅크림
  const pn=armyCount(P);
  if(s.raidT>0){s.raidT-=DIFF.think;
    if(s.raidT<=0&&myN<thresh){s.stance="hold";s._allout=false;toast(`${s.faction.ch} 적 습격대가 물러난다`);}}
  else if(gameTime>120&&s.stance==="hold"&&s.raidT<=0&&myN>=thresh*0.75&&Math.random()<0.06){
    s.stance="attack";s.raidT=10;
    for(const u of army)if(u.side===s)u.mode="attack";
    toast(`⚠ ${s.faction.ch} 적 견제 습격!`,"red");
  }
  const nukeThreat=P.nukeStage>=1;
  if(s.stance==="hold"&&((myN>=thresh&&myN>=pn*0.9)||myN>=thresh*1.5||foeCrossed||(nukeThreat&&myN>=thresh*0.7))){
    s.stance="attack";
    for(const u of army)if(u.side===s)u.mode="attack";
    toast(nukeThreat?`☢ ${s.faction.ch} 적이 핵개발을 감지 — 총공세!`:`⚠ ${s.faction.ch} 적군 총돌격!`,"red");
    SFX.alarm();
  } else if(s.stance==="attack"&&myN<=15&&!foeCrossed){
    s.stance="hold";s._allout=false;
    for(const u of army)if(u.side===s)u.mode="hold";toast(`${s.faction.ch} 적군이 재정비에 들어갔다`);
  }
  // 결사 항전: 열세이거나, 만충 상태로 8초 이상 묵히면 공세 직전에 사용
  if(s.ult>=100){
    s.ultHold=(s.ultHold||0)+DIFF.think;
    if(s.stance==="attack"||armyCount(s)<armyCount(P)*0.85||s.ultHold>6){s.ultHold=0;castUlt(s);}
  } else s.ultHold=0;
  // 증원 웨이브: 공세 중 수비대가 차면 파병 (수비 최소 6기 유지)
  if(s.stance==="attack"){
    const gar=army.filter(u=>u.side===s&&u.mode==="hold");
    if(gar.length>=10){
      gar.slice(0,gar.length-6).forEach(u=>u.mode="attack");
      toast(`${s.faction.ch} 적 증원 부대 출격`);
    }
  }
  // 호령 (플레이어와 동일 시스템)
  if(s.skillCd<=0&&s.stance==="attack"&&myN>=30){
    useTactic(s); // AI도 동일 — 전술 고유 쿨
  }
}

/* ═══════════ 결사 항전 (궁극기) ═══════════ */
function castUlt(s){
  if(s.ult<100)return;
  s.ult=0;
  rallySpecial(s);
  updateUltBtn();
  return;
  const f=foe(s);
  if(s.isPlayer){toast("🔥 결사 항전! 전군이 마지막 힘을 짜낸다","gold");SFX.nuke();flash(0.45);}
  else{toast(`⚠ ${s.faction.ch} 적의 결사 항전!`,"red");SFX.alarm();flash(0.3);}
  shakeT=0.6;
  const push=s.isPlayer?-120:120; // 적을 자기 진영(위/아래) 쪽으로
  for(const u of [...army]){
    if(u.side===f){
      u.hp-=u.hp*0.5;u.hitT=0.15;
      if(u.hp<=0)killUnit(u,s);
      else u.y+=push;
    } else {
      u.hp=u.maxHp;
    }
  }
  if(stallStage<2)s.cmdHp=Math.min(s.cmdMaxHp,s.cmdHp+s.cmdMaxHp*0.3);
  updateUltBtn();
}
function rallySpecial(s){
  const eraU=[0,0,0,1,1,1,2,2][Math.min(s.era,7)];
  const c=cmdPos(s);
  if(eraU===0){
    // 🐻 곰 출전: 전투곰 3마리 투입
    addUnit(s,"bear",1,true);
    const BST=["🐻 동굴 곰","🦏 전투 코뿔소","🐘 전쟁 맘모스"][Math.min(s.era,2)]||"🐻 동굴 곰";
    banner(s.isPlayer?BST+" 등장!!":"⚠ 적 "+BST.slice(2)+" 등장!!",s.isPlayer?"#F5C542":"#FF5A45");
  } else if(eraU===1){
    // 🪨 거대 투석기: 초대형 바위 2발
    const foes=army.filter(u=>u.side!==s);
    for(let k=0;k<2;k++){
      const tgt=foes.length?foes[Math.floor(SR()*foes.length)]:null;
      const tx=tgt?tgt.x:VW/2, ty=tgt?tgt.y:VH/2;
      shots.push({side:s,x:c.x+(k?30:-30),y:c.y,tx,ty,arc:true,t:-k*0.3,dur:1.3,
        dmg:450*s.atkMul,aoe:140,cmdShell:true,col:"#C8B99A",boulder:true});
    }
    const BLD=["🪨 거대 투석기","💥 화약 일제사","🚂 열차포"][Math.min(Math.max(s.era-3,0),2)];
    banner(s.isPlayer?BLD+"!!":"⚠ 적 "+BLD.slice(2)+"!!",s.isPlayer?"#F5C542":"#FF5A45");
  } else {
    // ✈️ 전투기: 세로 종단 폭격 + 유도 미사일 2발
    const jx=VW*0.5;
    const y0=s.isPlayer?VH*1.10:-VH*0.10;
    const y1=s.isPlayer?-VH*0.10:VH*1.10;
    jets.push({side:s,x:jx,y:y0,y0,y1,t:0,dur:1.7,vert:true});
    for(let k=0;k<6;k++){
      const by=s.isPlayer?VH*(0.44-0.065*k):VH*(0.56+0.065*k);
      shots.push({side:s,x:jx,y:by-26,tx:jx+(SR()-0.5)*150,ty:by,
        arc:true,t:-0.30-k*0.19,dur:0.42,dmg:520*s.atkMul,aoe:110,cmdShell:true,col:"#C2E07A"});
    }
    const foes2=army.filter(u=>u.side!==s);
    for(let k=0;k<2;k++){
      const tg=foes2.length?foes2[Math.floor(SR()*foes2.length)]:null;
      if(tg)missiles.push({side:s,x:VW*0.5,y:s.isPlayer?VH*0.96:VH*0.04,tgt:tg,spd:340,life:3});
    }
    const JT=s.era>=7?"🛰 궤도 폭격":"✈️ 전투기 폭격";
    banner(s.isPlayer?JT+"!!":"⚠ 적 "+JT.slice(2)+"!!",s.isPlayer?"#F5C542":"#FF5A45");
  }
  shakeT=0.35;SFX.nuke();
}
function fireRallyBeam(s){
  const c=cmdPos(s);
  const yEnd=s.isPlayer?VH*0.20:VH*0.80; // 적 지휘부 앞에서 멈춘다
  const y1=Math.min(c.y,yEnd),y2=Math.max(c.y,yEnd);
  beams.push({x:c.x,y1,y2,t:0.65,max:0.65,col:s.isPlayer?"#F5C542":"#FF6A55"});
  const dmg=[150,320,650][s.era]*s.atkMul;
  for(const u of [...army]){
    if(u.side===s)continue;
    if(Math.abs(u.x-c.x)<46&&u.y>y1&&u.y<y2){
      dealTo(u,dmg,s);
      burst(u.x,u.y,"#FFF3C4",6);
    }
  }
  shakeT=0.35;SFX.nuke();
}
function updateUltBtn(){

/* ═══════════ 전술 ═══════════ */
function curTactic(s){return s.tacticSel[s.era]||TACT8[Math.min(s.era,7)];}
function useTactic(s){
  const t=curTactic(s);
  s.skillCd=t.cd;
  const tgts=enemyTargets(s);
  if(t.id==="volley"||t.id==="storm"){
    const n=t.id==="storm"?5:3;
    if(s.isPlayer){toast(`🏹 ${t.name}!`);SFX.shoot(s.era);}
    else toast(`⚠ 적군 ${t.name}!`,"red");
    for(const u of army){if(u.side!==s)continue;const d=unitDef(u.id);
      if(d.role==="ranged"||d.role==="arty"){const [tg]=nearestOf(tgts.filter(o=>o.kind!=="monu"),u.x,u.y);
        if(tg)for(let k=0;k<n;k++)fireShot(s,u,tg,d,(k-(n-1)/2)*15);}}
  } else if(t.id==="charge"){
    if(s.isPlayer){toast("⚔️ 전군 돌격!");SFX.boom();}else toast("⚠ 적군 전군 돌격!","red");
    shakeT=0.3;
    const push=s.isPlayer?-52:52;
    const chargers=army.filter(u=>u.side===s&&["melee","tank"].includes(unitDef(u.id).role));
    for(const tg of tgts){
      if(tg.isCmd)continue;
      // 아군 근접 병력 주변 200px 내의 적만 타격 (국지전)
      const near=chargers.some(c=>{const dx=c.x-tg.x,dy=c.y-tg.y;return dx*dx+dy*dy<200*200;});
      if(!near)continue;
      dealTo(tg,95*s.atkMul,s);
      if(army.includes(tg))tg.y+=push;
    }
  } else if(t.id==="strike"){
    if(s.isPlayer)toast("✈️ 폭격 요청!");else toast("⚠ 적 폭격기 접근!","red");
    let delay=0;
    const yMin=s.isPlayer?VH*0.08:VH*0.55, yMax=s.isPlayer?VH*0.45:VH*0.92;
    for(let i=0;i<6;i++){
      setTimeout(()=>{if(!running)return;
        const x=VW*0.1+Math.random()*VW*0.8,y=yMin+Math.random()*(yMax-yMin);
        boom(x,y,66,"#FF7A3D");SFX.boom();shakeT=0.2;
        for(const tg of enemyTargets(s)){const dx=tg.x-x,dy=tg.y-y;
          if(dx*dx+dy*dy<66*66)dealTo(tg,340*s.atkMul,s);}
      },delay);delay+=130;
    }
  } else if(t.id==="barrage"){
    if(s.isPlayer)toast("🔥 탄막 집중! 8초");else toast("⚠ 적군 탄막 집중!","red");
    s.barrageT=8;
  } else if(t.id==="cry"){
    if(s.isPlayer)toast("🔥 함성! 8초 이동+40% 공격+25%");else toast("⚠ 적군 함성!","red");
    s.cryT=8;shakeT=Math.max(shakeT,0.2);
  } else if(t.id==="shield"){
    if(s.isPlayer)toast("🛡 방패벽! 10초 피해 −45% · 정지");else toast("⚠ 적군 방패벽!","red");
    s.shieldT=10;
  } else if(t.id==="over"){
    if(s.isPlayer)toast("⚡ 과부하! 8초 적 공속 반감");else toast("⚠ 적 과부하 — 아군 공속 저하!","red");
    s.overT=8;
  }
  s.skillCdMax=t.cd;
  if(s.isPlayer)updateTactBtn();
}
const tactBtn=$("tactBtn");
function updateTactBtn(reset){
  const lbl=$("tactLabel");
  if((NET.on?mySide():P).nukeReady){tactBtn.className="nuke";lbl.textContent=nukeAimMode?"☢ 조준 중…":"☢ 핵 조준";$("cdFill").style.width="0%";return;}

let sreelsM=[],slotSyms=[0,0,0],slotLock=0,slotTimers=[],slotTier=1;
function openSlot(tier){
  slotTier=Math.max(1,tier);slotLock=0;
  showPanel("🏛 문명의 축배 — 탭하여 정지",bar=>{

      if(btn.textContent==="확인"){slotTimers.forEach(t=>clearInterval(t));closePanel();return;}
      if(slotLock>=3)return;
      clearInterval(slotTimers[slotLock]);
      sreelsM[slotLock].className="sreelM lock";SFX.lock();
      slotLock++;
      if(slotLock===3){slotEval();btn.textContent="확인";}
    });

    sreelsM.forEach((el,i)=>{
      slotTimers[i]=setInterval(()=>{
        slotSyms[i]=Math.floor(Math.random()*SLOT_SYMS.length);

  });

function slotEval(){
  const [a,b,c]=slotSyms,t=slotTier;

    sreelsM.forEach(el=>el.className="sreelM hit");

      P.cmdHp=P.cmdMaxHp;P.hpMul*=1.15;msg="잭팟! ❤️ 완전 회복 + 체력 +15%";}
  } else if(pairSym>=0){
    const sym=SLOT_SYMS[pairSym];SFX.coin();
    if(sym==="💰"){const g=Math.round(110*t*P.goldMul);P.gold+=g;msg=`💰 +${g} 골드`;}
    if(sym==="⚔️"){P.atkMul*=1.10;msg="⚔️ 공격력 +10%";}
    if(sym==="👥"){const pool=UNITS.filter(u=>u.era===P.era&&!u.hidden);
      for(let i=0;i<2;i++){const u=pool[Math.floor(Math.random()*pool.length)];addUnit(P,u.id,u.pack||1,true);}
      msg="👥 병력 2명 합류";}

      P.cmdHp=Math.min(P.cmdMaxHp,P.cmdHp+P.cmdMaxHp*0.4);msg="❤️ 전군 회복 +40%";}
  } else {
    const g=Math.round(50*t*P.goldMul);P.gold+=g;
    msg=`꽝... 위로금 💰 +${g}`;
  }
  const r=$("slotResM");if(r)r.textContent=msg;

function netLog(t){const el=$("netStatus");if(el)el.textContent=t;}
function netSend(type,data){
  if(!NET.on||!NET.mqtt)return;
  NET.mqtt.publish("armyevo/"+NET.room+"/"+NET.role,JSON.stringify({t:type,d:data||{},k:NET.tick}));
}
function issueCmd(type,data){
  // 내 명령: delay틱 뒤 실행 예약 (틱 프레임에 실려 전송됨)
  if(!NET.on){applyCmd(NET.role||"h",type,data);return;}
  const ex=Math.max(NET.tick+NET.delay,NET.sentUpto+1); // 미송신 프레임에 배치
  (NET.myCmds[ex]=NET.myCmds[ex]||[]).push({t:type,d:data});
  NET.forceFlush=true; // 명령은 즉시 송신
}
function mySide(){return NET.role==="g"?E:P;}
function sideOf(r){return r==="g"?E:P;}
function applyCmd(role,type,d){
  const s=sideOf(role);
  if(type==="hire"){
    const u=UNITS.find(x=>x.id===d.u);
    if(u&&s.gold>=u.cost){s.gold-=u.cost;addUnit(s,u.id,u.pack||1,true);}
  } else if(type==="fleet"){
    toggleFleet(s);
  } else if(type==="wonder"){
    doWonder(s);
  } else if(type==="standall"){
    doStand(s);
  } else if(type==="retreat"){
    doRetreat(s);
  } else if(type==="stance"){
    if(role===NET.role)NET.stancePending=false;
    if(s.stance==="attack"){
      const gar=army.filter(x=>x.side===s&&x.mode!=="attack");
      if(gar.length>0){gar.forEach(x=>x.mode="attack");}
      else{s.stance="hold";s._allout=false;for(const x of army)if(x.side===s)x.mode="stand";}
    } else {s.stance="attack";s._allout=true;for(const x of army)if(x.side===s)x.mode="attack";}
    if(s===P)updateStanceBtn();
  } else if(type==="triad"){
    if(s===P&&triadOffer){const c=triadOffer[d.k];
      if(!(c.cost&&s.gold<c.cost)){if(c.cost)s.gold-=c.cost;c.f(s);triadOffer=null;renderTriad();}}
    else if(s===E){aiApplyTriad(s,d.k);}
  } else if(type==="rally"){
    if(s.skillCd<=0){useTactic(s);
      toast((s===P?"📣 ":"⚠ 적 ")+(s.doctrine||DOCTRINES[0]).name+" 발동!",s===P?"gold":"red");}
  } else if(type==="ult"){
    if(s.ult>=100)castUlt(s);
  } else if(type==="nuke"){
    if(s.nukeReady)launchNukeAt(s,d.x*VW,d.y*VH);
  } else if(type==="flag"){
    s.flag={x:d.x*VW,y:d.y*VH};
  } else if(type==="struct"){
    const costS=d.k==="tw"?TW_COST[s.era]:d.k==="bank"?BK_COST[s.era]:d.k==="wall"?WALL_COST[s.era]:{hosp:400,snip:350,ic:1800,dock:400,coast:350,msb:2800,dome:2200,aa:700}[d.k]||500;
    if(isUnlocked(s,d.k)&&s.gold>=costS){
      const okB=d.k==="tw"?buildTower(s):d.k==="hosp"?buildHospital(s):d.k==="snip"?buildSniper(s):d.k==="bank"?buildBank(s):d.k==="wall"?buildWall(s):d.k==="dock"?buildDock(s):d.k==="coast"?buildCoast(s):d.k==="msb"?buildMsb(s):d.k==="aa"?buildAA(s):d.k==="dome"?buildDome(s):buildIntercept(s);
      if(okB){s.gold-=costS;
        const mineS=NET.on?(s===mySide()):s.isPlayer;
        toast(mineS?"🏗 건설 완료":"⚠ 적 구조물 건설",mineS?"gold":"red");
        if(mineS)renderHireDock();
      }
    }
  } else if(type==="item"){
    const idx=items.findIndex(x=>x.id===d.id);
    if(idx>=0){applyItem(s,items[idx]);items.splice(idx,1);}
  } else if(type==="heroup"){
    buyHeroUp(s);
  } else if(type==="hero"){

function aiApplyTriad(s,k){
  if(!s.triadOffer)return;
  const c=s.triadOffer[k];if(!c)return;
  if(c.cost&&s.gold<c.cost)return;
  const ok=c.f(s); // 비용은 카드 효과가 스스로 차감
  if(ok===false)return;

}
let _netWait=0;
function netHud(t){const el=$("netHud");if(el){el.style.display=NET.on?"block":"none";el.textContent=t;}}
function flushInputs(){
  // 3틱당 1회 송신 (명령 발생 시 즉시) — 릴레이 과부하 방지
  if(!NET.forceFlush&&NET.tick<(NET.nextFlush||0))return;
  NET.forceFlush=false;NET.nextFlush=NET.tick+2;
  const upto=NET.tick+NET.delay;
  if(upto<=NET.sentUpto)return;
  const cmds={};
  for(const t in NET.myCmds)if(+t<=upto)cmds[t]=NET.myCmds[t]; // 미실행 전부 재전송 (유실 내성)
  netSend("inp",{from:NET.sentUpto+1,upto,cmds});
  NET.sentUpto=upto;
}
function netTick(dtReal){
  // 락스텝: 상대 클리어 지점까지만 전진
  NET.acc+=dtReal;
  const STEP=1/30;
  flushInputs();
  let guard=0;
  while(NET.acc>=STEP&&guard++<30){
    if(NET.tick>NET.peerUpto){ // 상대의 이 틱 입력을 아직 못 받음
      _netWait+=dtReal;
      netHud(_netWait>1.5?"⏳ 상대 기기 대기 중…":"⚔ 동기화");
      break;
    }
    _netWait=0;netHud("⚔ 연결됨 · "+Math.floor(NET.tick/30)+"s");
    // 결정성: 항상 방장(h) 명령 먼저, 참가(g) 나중
    const hq=(NET.role==="h"?NET.myCmds:NET.peerCmds)[NET.tick];
    const gq=(NET.role==="g"?NET.myCmds:NET.peerCmds)[NET.tick];
    if(hq)for(const c of hq)applyCmd("h",c.t,c.d);
    if(gq)for(const c of gq)applyCmd("g",c.t,c.d);
    delete NET.myCmds[NET.tick];delete NET.peerCmds[NET.tick];
    update(STEP);
    NET.tick++;NET.acc-=STEP;
  }
}
function startPvp(role,code){
  NET.role=role;NET.room=code;NET.on=true;
  netLog("연결 중…");
  try{
    NET.mqtt=mqtt.connect("wss://broker.emqx.io:8084/mqtt",{clientId:"ae_"+role+"_"+Math.floor(Math.random()*1e6)});
  }catch(e){netLog("연결 실패 — 네트워크 확인");return;}
  NET.mqtt.on("connect",()=>{
    const other=role==="h"?"g":"h";
    NET.mqtt.subscribe("armyevo/"+code+"/"+other);
    netLog(role==="h"?"방 생성됨 — 상대 대기 중":"참가 중 — 방장 대기");
    netSend("hello",{doc:selDoc||0});
  });
  NET.mqtt.on("message",(topic,msg)=>{
   try{
    let m;try{m=JSON.parse(msg.toString());}catch(e){return;}
    if(m.t==="hello"){
      NET.peerReady=true;NET.peerDoc=m.d.doc||0;
      netSend("hello2",{doc:selDoc||0});
      if(NET.role==="h"&&!NET.started){
        simSeed=Math.floor(Math.random()*1e9);
        netSend("start",{seed:simSeed});
        pvpBegin(simSeed);
      }
    } else if(m.t==="hello2"){
      NET.peerReady=true;NET.peerDoc=m.d.doc||0;
    } else if(m.t==="start"&&NET.role==="g"&&!NET.started){
      pvpBegin(m.d.seed);
    } else if(m.t==="inp"){
      for(const t in (m.d.cmds||{}))NET.peerCmds[t]=m.d.cmds[t];
      NET.peerUpto=Math.max(NET.peerUpto,m.d.upto);
    }
   }catch(err){showErr("net:"+(err&&err.message||err));}
  });
  NET.mqtt.on("error",()=>netLog("연결 오류 — 재시도 필요"));
}

function draw(){

      { // BUILD-05 §1: 이모지·숫자·별 — 크기가 곧 병력

      }
      continue;
    }
    ctx.fillStyle=u.hitT>0?"#FFFFFF":d.col;
    const foeStroke=!u.side.isPlayer;
    for(const [ox,oy] of offs){
      const x=u.x+ox*cw,y=u.y+oy*cw;
      if(d.role==="tank"){
        ctx.fillRect(x-dot,y-dot,dot*2,dot*2);
        if(foeStroke){ctx.strokeStyle="#E8523D";ctx.lineWidth=1.2;ctx.strokeRect(x-dot,y-dot,dot*2,dot*2);}
      } else if(d.role==="arty"){

      } else {
        ctx.beginPath();ctx.arc(x,y,dot,0,6.283);ctx.fill();
        if(foeStroke){ctx.strokeStyle="#E8523D";ctx.lineWidth=1.2;ctx.stroke();}
      }
    }
    const sz=cw+dot;
      { // BUILD-05 §1: 이모지·숫자·별 — 크기가 곧 병력
        const alive=Math.max(1,Math.ceil(u.hp/u.maxHp*Math.pow(5,u.tier)));
        const px=alive<=2?16:alive<=5?22:alive<=9?28:alive<=14?34:40;

        ctx.fillText(alive,u.x,baseY+px*0.55);
        const stT=starOf(u);
        if(stT>0){ // ☆ 은=강화(산 별) · ★ 금=전투(얻은 별)
          const nb=Math.min(u.starB||0,stT),ne=stT-nb;

          const s1="☆".repeat(nb),s2="★".repeat(ne);
          const _m1=ctx.measureText(s1),_m2=ctx.measureText(s2);
          const w1=(_m1&&_m1.width)||s1.length*px*0.42,w2=(_m2&&_m2.width)||s2.length*px*0.42,x0=u.x-(w1+w2)/2;
          ctx.textAlign="left";

      if(p.fam==="g"){ // 🔫 예광탄: 밝고 빠른 섬광선
        const k3=Math.max(0,k-0.05),x3=p.x+(p.tx-p.x)*k3,y3=p.y+(p.ty-p.y)*k3-Math.sin(k3*Math.PI)*70;
        ctx.strokeStyle="#FFF3C0";ctx.lineWidth=2.4;ctx.globalAlpha=0.95;
        ctx.beginPath();ctx.moveTo(x3,y3);ctx.lineTo(x,y);ctx.stroke();ctx.globalAlpha=1;continue;
      }
      ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(x,y,p.cmdShell?5.5:4,0,6.283);ctx.fill();continue;
    }
    ctx.fillStyle=p.side.isPlayer?(p.col||"#F5C542"):"#FF8A7A";
    if(p.fam==="l"){ // ⚡ 레이저: 청록 광선
      const L4=Math.hypot(p.vx,p.vy)||1,lx=p.vx/L4*16,ly2=p.vy/L4*16;
      ctx.strokeStyle="#7FFFEE";ctx.lineWidth=2.6;ctx.globalAlpha=0.95;
      ctx.beginPath();ctx.moveTo(p.x-lx,p.y-ly2);ctx.lineTo(p.x,p.y);ctx.stroke();
      ctx.strokeStyle="#FFFFFF";ctx.lineWidth=1;ctx.globalAlpha=0.8;
      ctx.beginPath();ctx.moveTo(p.x-lx*0.6,p.y-ly2*0.6);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.globalAlpha=1;
      // 계속 아래 화살 분기로 통과하지 않도록
    } else if(p.fam==="b"){ // 🏹 화살
      const L2=Math.hypot(p.vx,p.vy)||1,ax=p.vx/L2*9,ay=p.vy/L2*9;
      ctx.strokeStyle=p.col;ctx.lineWidth=1.8;
      ctx.beginPath();ctx.moveTo(p.x-ax,p.y-ay);ctx.lineTo(p.x,p.y);ctx.stroke();
    } else if(p.fam==="g"){ // 🔫 예광탄
      const L3=Math.hypot(p.vx,p.vy)||1,gx=p.vx/L3*13,gy=p.vy/L3*13;
      ctx.strokeStyle="#FFF3C0";ctx.lineWidth=2.2;ctx.globalAlpha=0.95;
      ctx.beginPath();ctx.moveTo(p.x-gx,p.y-gy);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.globalAlpha=1;
    } else {
      ctx.beginPath();ctx.arc(p.x,p.y,p.big?5.5:3,0,6.283);ctx.fill();
    }
  }
  for(const j of sorties){ // ✈ 소티기
    const ang=Math.atan2((j.ph===0?j.ty:j.hy)-j.y,(j.ph===0?j.tx:j.hx)-j.x);
    ctx.save();ctx.translate(j.x,j.y);ctx.rotate(ang);
    ctx.fillStyle=j.side.isPlayer?"#C2E07A":"#FF8A7A";
    ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-8,-7);ctx.lineTo(-4,0);ctx.lineTo(-8,7);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  // 전투기
  for(const j of jets){
    ctx.save();ctx.translate(j.x,j.y);
    ctx.rotate(j.vert?(j.side.isPlayer?-Math.PI/2:Math.PI/2):(j.side.isPlayer?0:Math.PI));
    ctx.fillStyle=j.side.isPlayer?"#B8C9DE":"#E8523D";
    ctx.beginPath();ctx.moveTo(26,0);ctx.lineTo(-14,-11);ctx.lineTo(-6,0);ctx.lineTo(-14,11);ctx.closePath();ctx.fill();
    ctx.fillStyle="rgba(255,255,255,0.25)";
    ctx.fillRect(-30,-2,14,4);
    ctx.restore();
    const bwd=j.vert?(j.side.isPlayer?24:-24):0;
    if(Math.random()<0.6)parts.push({x:j.x+(j.vert?(Math.random()-0.5)*6:-24),y:j.y+bwd,vx:(Math.random()-0.5)*14,vy:j.vert?(j.side.isPlayer?60:-60):(Math.random()-0.5)*14,t:0.35,c:"#8E937F"});
  }
  // 유도 미사일
  for(const ms of missiles){
    const dx=(ms.tgt?ms.tgt.x:ms.x)-ms.x,dy=(ms.tgt?ms.tgt.y:ms.y)-ms.y,a=Math.atan2(dy,dx);
    ctx.save();ctx.translate(ms.x,ms.y);ctx.rotate(a);
    ctx.fillStyle=ms.side.isPlayer?"#F5C542":"#FF6A55";
    ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-6,-3.5);ctx.lineTo(-6,3.5);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  for(const b of booms){const k=1-b.t/b.max;
    ctx.globalAlpha=1-k;ctx.fillStyle=b.c;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*k,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.t/0.35);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);}
  ctx.globalAlpha=1;
  // ── 지형 (라인 + 나무/바위)
  // 거리 밴드 음영
  for(let b=0;b<10;b++){
    if(b%2)continue;
    ctx.fillStyle="rgba(255,255,255,0.016)";
    ctx.fillRect(0,VH*b/10,VW,VH/10);
  }
  // 중앙선 + 대기선
  ctx.setLineDash([14,10]);
  ctx.strokeStyle="rgba(245,197,66,0.30)";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,VH*0.5);ctx.lineTo(VW,VH*0.5);ctx.stroke();
  ctx.strokeStyle="rgba(127,168,217,0.16)";
  ctx.beginPath();ctx.moveTo(0,VH*0.545);ctx.lineTo(VW,VH*0.545);ctx.stroke();
  ctx.strokeStyle="rgba(232,82,61,0.16)";
  ctx.beginPath();ctx.moveTo(0,VH*0.455);ctx.lineTo(VW,VH*0.455);ctx.stroke();
  ctx.setLineDash([]);
  // 집결 깃발
  if(P&&P.flag){
    const f=P.flag;
    ctx.strokeStyle="#F5C542";ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x,f.y-26);ctx.stroke();
    ctx.fillStyle="#F5C542";
    ctx.beginPath();ctx.moveTo(f.x,f.y-26);ctx.lineTo(f.x+16,f.y-20);ctx.lineTo(f.x,f.y-14);ctx.closePath();ctx.fill();
  }
  // 핵 경고 마커
  for(const n of nukes){
    const R=VW*0.30,k=1-n.t/n.max;
    ctx.strokeStyle="#FF3B2F";ctx.lineWidth=3;
    ctx.globalAlpha=0.35+0.4*Math.sin(gameTime*14);
    ctx.beginPath();ctx.arc(n.tx,n.ty,R,0,6.283);ctx.stroke();
    ctx.globalAlpha=0.9;
    ctx.beginPath();ctx.arc(n.tx,n.ty,R*k,0,6.283);ctx.stroke();
    ctx.font="900 26px system-ui";ctx.textAlign="center";ctx.fillStyle="#FF3B2F";
    ctx.fillText("☢",n.tx,n.ty+9);
    ctx.globalAlpha=1;
  }
  // 버섯구름
  for(const mu of mushrooms){
    const k=mu.t/2.2;
    // 확장 충격파 링
    ctx.strokeStyle="#FFE9A8";ctx.lineWidth=8*(1-k);
    ctx.globalAlpha=(1-k)*0.9;
    ctx.beginPath();ctx.arc(mu.x,mu.y,mu.R*(0.3+k*1.3),0,6.283);ctx.stroke();
    // 화구 → 기둥 → 갓
    const rise=Math.min(1,mu.t/1.1);
    ctx.globalAlpha=(1-k)*0.95;
    ctx.fillStyle="#FF9A3D";
    ctx.beginPath();ctx.arc(mu.x,mu.y,mu.R*0.28*(1-k*0.4),0,6.283);ctx.fill();
    ctx.fillStyle="#D9BC7A";
    ctx.fillRect(mu.x-mu.R*0.09,mu.y-mu.R*0.9*rise,mu.R*0.18,mu.R*0.9*rise);
    ctx.beginPath();ctx.arc(mu.x,mu.y-mu.R*0.9*rise,mu.R*0.3*(0.5+rise*0.7),0,6.283);ctx.fill();
    ctx.globalAlpha=1;
  }
  // 지휘부 레이저
  for(const b of beams){
    const k=b.t/b.max;
    ctx.globalAlpha=k*0.28;ctx.fillStyle=b.col;
    ctx.fillRect(b.x-46,b.y1,92,b.y2-b.y1);
    ctx.globalAlpha=k*0.85;
    ctx.fillRect(b.x-10,b.y1,20,b.y2-b.y1);
    ctx.globalAlpha=k;ctx.fillStyle="#FFFFFF";
    ctx.fillRect(b.x-3,b.y1,6,b.y2-b.y1);
    ctx.globalAlpha=1;
  }
  // 칼 베기 궤적
  ctx.lineWidth=2.5;ctx.lineCap="round";
  for(const sl of slashes){
    const k=1-sl.t/0.16;
    ctx.globalAlpha=(1-k)*0.9;
    ctx.strokeStyle="#FFFFFF";
    ctx.beginPath();
    ctx.arc(sl.x,sl.y,11+k*7,sl.a,sl.a+2.2);
    ctx.stroke();
    ctx.globalAlpha=(1-k)*0.4;ctx.strokeStyle="#B8C9DE";
    ctx.beginPath();ctx.arc(sl.x,sl.y,8+k*6,sl.a+0.3,sl.a+1.9);ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.textAlign="center";ctx.font="700 11px ui-monospace,monospace";
  for(const t of texts){ctx.globalAlpha=Math.min(1,t.t*2.5);ctx.fillStyle=t.c;ctx.fillText(t.v,t.x,t.y);}
  ctx.globalAlpha=1;
  ctx.restore();
}
function mixRed(col){
  const r=parseInt(col.slice(1,3),16),g=parseInt(col.slice(3,5),16),b=parseInt(col.slice(5,7),16);
  const m2=(a,b2)=>Math.round(a*0.45+b2*0.55);
  return "#"+[m2(r,232),m2(g,82),m2(b,61)].map(v=>v.toString(16).padStart(2,"0")).join("");
}
function shadeFoe(col){ // 적 유닛은 붉은 계열로 톤 시프트
  return col; // 형태 유지, 외곽 없이 팀 구분은 위치+발사체 색으로
}

/* ═══════════ 시작/종료 ═══════════ */
function startGame(){
  au();
  // 적 부족: 미수집 우선
  const uncollected=FACTIONS.filter(f=>!meta.trophies.some(t=>t.ch===f.ch));
  const pool=uncollected.length?uncollected:FACTIONS;
  const fac=pool[Math.floor(Math.random()*pool.length)];
  window._aggro=0.8+Math.random()*0.35; // AI 공격성 주사위

  P=newSide(true,null);E=newSide(false,fac);
  P.doctrine=DOCTRINES[selDoc||0];P.flag=null;
  E.doctrine=DOCTRINES[{pop:0,wep:1,civ:2}[E.faction.style]||0];
  army=[];shots=[];booms=[];texts=[];parts=[];items=[];slashes=[];beams=[];nukes=[];mushrooms=[];jets=[];missiles=[];structures=[];
  nukeAimMode=false;timeScale=1;slowT=0;
  modalQueue=[];panelQueue=[];activePanel=null;closePanel();
  slotTimers.forEach(t=>clearInterval(t));
  supplyT=5;gameTime=0;zoom=1;
  // 🧪 테스트 패널 적용 — 시대·1만골드는 양측 동일(대칭). 무한골드·AI정지는 플레이어 테스트 도구
  window._aiStop=!TP.ai;window._infGold=(TP.gold==="inf");
  if(TP.era>0)for(const S3 of[P,E]){S3.era=TP.era;S3.unlockIdx=99;
    S3.tacticSel[S3.era]=TACTICS[[0,0,0,1,1,1,2,2][Math.min(S3.era,7)]][0];}
  if(TP.gold==="10000"){P.gold=10000;E.gold=10000;}
  if(TP.gold==="inf")P.gold=999999;
  ["startOverlay","endOverlay"].forEach(id=>$(id).classList.add("hidden"));
  $("toastZone").innerHTML="";
  const persona=(window._aggro<0.95?"신중한 ":"호전적 ")+({pop:"물량꾼",wep:"정예주의",civ:"문명광"}[fac.style]);
  $("foeName").textContent=`${fac.ch} ${persona}`;
  $("myEra").textContent="🏹 원시";
  tactBtn.className="";
  renderTrophies();
  zoom=1;resize();
  window._fallT=0;sorties.length=0;
  if(meta.tips&&!meta.tipHint){meta.tipHint=true;setTimeout(()=>{try{toast("💡 아이콘을 길게 누르면 설명","gold");}catch(e){}},4500);}
  if(!NET.on){ // 개국 이념 (1P)
    introHold=true;introAcc=0;
    const tp=$("traitPick");tp.style.display="flex";
    E.trait=["mil","cul","com"][Math.floor(Math.random()*3)]; // AI도 이념 보유
    applyTrait(E);
    tp.querySelectorAll(".trBtn").forEach(b=>{b.onclick=()=>{
      P.trait=b.dataset.t;applyTrait(P);
      tp.style.display="none";
      toast({mil:"⚔ 군사 전통 — 전군 공격 +6%",cul:"🏛 문화 전통 — 문명이 빠르게 꽃핀다",com:"💰 상업 전통 — 국고가 두둑해진다"}[P.trait],"gold");
      runCountdown();
    };});
  } else runCountdown(); // 3·2·1·GO!
  cam.x=0;cam.y=0;cam.z=1;cam.auto=true;updateCamBtn();
  triadOffer=null;renderTriad();window._allout=false;window._finalT=false;updateStanceBtn();
  dockEra=-1;renderHireDock();
  addUnit(P,"arch",1,true);
  addUnit(E,"arch",1,true);
  running=true;paused=false;
  updateTactBtn(true);
  toast(`${fac.ch} ${fac.name}과의 전쟁 — 🛡 병력을 모아 ⚔ 돌격하라!`);
}
function beginFall(loser,win,msg){
  if(window._fallT)return;window._fallT=1;
  loser._fallen=1;
  slowT=1.8;timeScale=0.3;
  const c=cmdPos(loser);
  for(let k=0;k<4;k++)setTimeout(()=>{
    boom(c.x+(Math.random()-0.5)*70,c.y+(Math.random()-0.5)*40,90+k*35,"#FF9A55");
    shakeT=0.6;SFX.boom();
    for(let j=0;j<10;j++)parts.push({x:c.x,y:c.y,vx:(Math.random()-0.5)*160,vy:-60-Math.random()*120,t:0.9,c:Math.random()<0.5?"#FF7A45":"#C8B99A"});
  },k*330);
  setTimeout(()=>{
    boom(c.x,c.y,280,"#FFD27A");flash(0.5);shakeT=1.0;SFX.boom();SFX.boom();
  },1450);
  setTimeout(()=>{window._fallT=0;endGame(win,msg);},2300);
}
function endGame(win,subMsg){
  if(NET.on){
    win=NET.role==="g"?!win:win;
    subMsg=win?"⚔ 상대 지휘부 함락!":"본진 지휘부가 함락되었다";
  }
  running=false;paused=false;
  closePanel();panelQueue=[];slotTimers.forEach(t=>clearInterval(t));
  if(win){
    meta.wins++;
    if(E.faction&&!meta.trophies.some(t=>t.ch===E.faction.ch)){
      meta.trophies.push({ch:E.faction.ch,...E.faction.trophy});
      SFX.trophy();
      subMsg+=` 🏆 ${E.faction.trophy.n} 획득! (${E.faction.trophy.b}, 영구)`;
    }
  }
  $("endTitle").textContent=win?"승리":"패배";
  $("endTitle").style.color=win?"var(--gold)":"var(--red)";
  $("endSub").textContent=subMsg;
  $("eKills").textContent=P.kills;
  const m=Math.floor(gameTime/60),s=Math.floor(gameTime%60);
  $("eTime").textContent=`${m}:${s<10?"0":""}${s}`;
  $("eArmy").textContent=P.maxArmy;
  $("endOverlay").classList.remove("hidden");
  try{navigator.vibrate&&navigator.vibrate(win?[40,60,120]:90);}catch(e){}
}
$("startBtn").onclick=()=>{
  if(NET.on){toast("2인 대전 연결 중 — 자동으로 시작됩니다");return;}
  startGame();
};
$("retryBtn").onclick=startGame;

/* ═══════════ 메인 루프 ═══════════ */
let last=performance.now();
let _errShown=0;
function showErr(msg){
  if(_errShown++>3)return;
  try{banner("⚠ 오류","#FF5A45");toast(String(msg).slice(0,90),"red");}catch(e2){}
}
window.addEventListener("error",e=>showErr(e.message||e));
window.addEventListener("unhandledrejection",e=>showErr(e.reason||"promise"));
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(running){
    try{
      if(NET.on&&NET.started)netTick(dt);else update(dt);
    }catch(err){showErr(err&&err.message||err);}
    try{if(!paused)draw();}catch(err2){showErr(err2&&err2.message||err2);}
  }
  requestAnimationFrame(loop);
}
$("pvpBtn").onclick=()=>{
  const pnl=$("pvpPanel");
  pnl.style.display=pnl.style.display==="none"?"flex":"none";
};
$("hostBtn").onclick=()=>{
  const code=($("roomCode").value||"").trim();
  if(code.length<4){netLog("4자리 코드를 입력하세요");return;}
  startPvp("h",code);
};
$("joinBtn").onclick=()=>{
  const code=($("roomCode").value||"").trim();
  if(code.length<4){netLog("4자리 코드를 입력하세요");return;}
  startPvp("g",code);
};
resize();
requestAnimationFrame(loop);
</script>
